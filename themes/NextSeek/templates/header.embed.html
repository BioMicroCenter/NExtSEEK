{% load static mezzanine_tags %}
<div class="header-content">
    <button class="btn btn-link sidebar-toggle-main d-lg-none" type="button" onclick="toggleSidebar()">
        <i class="bi bi-list fs-4"></i>
    </button>

    <div class="header-search">
        <div class="input-group">
            <input type="text" id="search-uid" class="form-control" placeholder="Search by UID">
            <button class="btn btn-primary" type="button" id="search-uid-button" onclick="navUID()">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </div>

    <div class="header-actions">
        {% include "includes/user_panel.html" %}
    </div>
</div>

<script>
document.getElementById("search-uid").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById("search-uid-button").click();
    }
});

function navUID() {
    const input = document.getElementById("search-uid");
    if (input.value.trim()) {
        window.location.href = "/seek/sampletree/uid=" + encodeURIComponent(input.value) + "/";
    }
}

function toggleSidebar() {
    document.body.classList.toggle('sidebar-open');
}
</script>
