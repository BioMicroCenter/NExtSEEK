{% load static mezzanine_tags %}
<div class="header-content">

    <button class="sidebar-toggle-main" type="button" onclick="toggleSidebar()" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
    </button>

    <div class="header-search">
        <div class="input-group">
            <input
                type="text"
                id="search-uid"
                class="form-control"
                placeholder="Search by UID…"
                aria-label="Search by sample UID"
            >
            <button class="btn btn-primary btn-search" type="button" id="search-uid-button" onclick="navUID()" aria-label="Search">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </div>

    <div class="header-actions">
        {% include "includes/user_panel.html" %}
    </div>

</div>

<script>
document.getElementById("search-uid").addEventListener("keypress", function(e) {
    if (e.key === "Enter") { e.preventDefault(); navUID(); }
});
function navUID() {
    var v = document.getElementById("search-uid").value.trim();
    if (v) window.location.href = "/seek/sampletree/uid=" + encodeURIComponent(v) + "/";
}
</script>
