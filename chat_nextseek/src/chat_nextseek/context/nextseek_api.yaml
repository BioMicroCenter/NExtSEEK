openapi: 3.1.0
info:
  title: NExtSEEK API
  version: 0.1.0
paths:
  /nextseek_api/admin/samples/retrieve/:
    post:
      operationId: Admin Sample Retrieval
      description: 'Export sample metadata to Excel for admin users. Accepts a list
        of sample UIDs and returns an Excel workbook containing full metadata for
        those samples and all derived samples. Requires admin privileges. Examples:
        ''Export all metadata for NHP-220630FLY-1-PUB and its derived samples to Excel'';
        ''Download a spreadsheet with data for these three monkeys'''
      tags:
      - Samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRetrieveRequest'
            examples:
              UIDList:
                value:
                  retrieval_uids:
                  - UID1
                  - UID2
                summary: UID list
              Whitespace-separated:
                value:
                  retrieval_uids_text: UID1 UID2 UID3
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminRetrieveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRetrieveRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
              examples:
                UIDList:
                  value:
                    retrieval_uids:
                    - UID1
                    - UID2
                  summary: UID list
                Whitespace-separated:
                  value:
                    retrieval_uids_text: UID1 UID2 UID3
          description: ''
  /nextseek_api/assays/:
    get:
      operationId: List Assays
      description: 'Retrieve all assays (experimental procedures) you have access
        to. Returns assay titles, types, technologies used, and IDs for linked studies,
        samples, and data files. Examples: ''Show me all available assays''; ''What
        experimental procedures have been run on the primate samples?'''
      tags:
      - Assays
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssayListResponse'
              examples:
                ListAssays:
                  value:
                  - data:
                    - id: '351'
                      type: assays
                      attributes:
                        title: A Maximal experimental Assay
                      links:
                        self: /assays/351
                    jsonapi:
                      version: '1.0'
                    links:
                      self: /assays?page[number]=1&page[size]=100
                    meta:
                      base_url: https://fairdata-dev.mit.edu
                      api_version: v1
                  summary: List Assays
          description: ''
    post:
      operationId: Create an Assay
      description: 'Define a new assay (experimental procedure) within a study. Specify
        the assay type, technology, and link to samples and protocols. Returns the
        created assay with its assigned ID and metadata. Examples: ''Create a new
        transcriptomics assay for the immune response study''; ''Add a histology assay
        to analyze the tissue samples'''
      tags:
      - Assays
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssayCreateRequest'
            examples:
              CreateAssay:
                value:
                  data:
                    type: assays
                    attributes:
                      title: A Maximal experimental Assay
                      assay_class:
                        key: EXP
                      assay_type:
                        uri: http://jermontology.org/ontology/JERMOntology#Transcriptomics
                      technology_type:
                        uri: http://jermontology.org/ontology/JERMOntology#RNA-Seq
                    relationships:
                      study:
                        data:
                          type: studies
                          id: '434'
                summary: Create Assay
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssayCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssayCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssaySingleResponse'
              examples:
                CreateAssay:
                  value:
                    data:
                      type: assays
                      attributes:
                        title: A Maximal experimental Assay
                        assay_class:
                          key: EXP
                        assay_type:
                          uri: http://jermontology.org/ontology/JERMOntology#Transcriptomics
                        technology_type:
                          uri: http://jermontology.org/ontology/JERMOntology#RNA-Seq
                      relationships:
                        study:
                          data:
                            type: studies
                            id: '434'
                  summary: Create Assay
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssaySingleResponse'
              examples:
                CreateAssay:
                  value:
                    data:
                      type: assays
                      attributes:
                        title: A Maximal experimental Assay
                        assay_class:
                          key: EXP
                        assay_type:
                          uri: http://jermontology.org/ontology/JERMOntology#Transcriptomics
                        technology_type:
                          uri: http://jermontology.org/ontology/JERMOntology#RNA-Seq
                      relationships:
                        study:
                          data:
                            type: studies
                            id: '434'
                  summary: Create Assay
          description: ''
  /nextseek_api/assays/{uid}/:
    get:
      operationId: Fetch an Assay
      description: 'Fetch details for a specific assay by its ID. Returns full metadata
        including title, assay type, technology used, linked study, associated samples,
        protocols, and generated data files. Examples: ''Show me the details of the
        RNA-seq assay''; ''What samples were processed in this flow cytometry experiment?'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric). Non-numeric UID resolution not configured.
        required: true
      tags:
      - Assays
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssaySingleResponse'
              examples:
                GetAssay:
                  value:
                    data:
                      id: '351'
                      type: assays
                      attributes:
                        title: A Maximal experimental Assay
                      relationships:
                        study:
                          data:
                            type: studies
                            id: '434'
                      links:
                        self: /assays/351
                      meta: {}
                    jsonapi:
                      version: '1.0'
                  summary: Get Assay
          description: ''
    patch:
      operationId: Update an Assay
      description: 'Update an existing assay by its ID. Modify title, description,
        assay type, technology, or linked samples and data files. Returns the updated
        assay with all current metadata. Examples: ''Update the description for the
        RNA-seq assay''; ''Add additional samples to the flow cytometry experiment'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric). Non-numeric UID resolution not configured.
        required: true
      tags:
      - Assays
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssayUpdateRequest'
            examples:
              PatchAssay:
                value:
                  data:
                    type: assays
                    id: '351'
                    attributes:
                      description: Revised description
                summary: Patch Assay
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssayUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssayUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssaySingleResponse'
              examples:
                PatchAssay:
                  value:
                    data:
                      type: assays
                      id: '351'
                      attributes:
                        description: Revised description
                  summary: Patch Assay
          description: ''
  /nextseek_api/data_files/:
    get:
      operationId: List DataFiles
      description: 'Retrieve all data files you have access to, including spreadsheets,
        images, sequencing outputs, and other research data. Returns file titles,
        descriptions, content types, and associated projects or assays. Examples:
        ''Show me all uploaded data files''; ''What sequencing results are available
        for download?'''
      tags:
      - DataFiles
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataFileListResponse'
              examples:
                ListDataFiles:
                  value:
                  - data:
                    - id: '560'
                      type: data_files
                      attributes:
                        title: DF-20240101-01_Sample-X.csv
                      links:
                        self: /data_files/560
                    jsonapi:
                      version: '1.0'
                    links:
                      self: /data_files?page[number]=1&page[size]=100
                    meta:
                      base_url: http://localhost:3000
                      api_version: v1
                  summary: List DataFiles
          description: ''
    post:
      operationId: Create a DataFile
      description: 'Register a new data file by providing a URL or uploading content.
        Associate with projects, assays, or samples. Returns the created file record
        with its assigned ID and metadata. Examples: ''Upload the microscopy images
        from today''s experiment''; ''Register a new sequencing output file for the
        water study'''
      tags:
      - DataFiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataFileCreateRequest'
            examples:
              CreateDataFile:
                value:
                  data:
                    type: data_files
                    attributes:
                      title: DF-20240101-01_Sample-X.csv
                      content_blobs:
                      - url: https://example.com/file.csv
                        content_type: text/csv
                    relationships:
                      projects:
                        data:
                        - id: '560'
                          type: projects
                summary: Create DataFile
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataFileCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataFileCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFileSingleResponse'
              examples:
                CreateDataFile:
                  value:
                    data:
                      type: data_files
                      attributes:
                        title: DF-20240101-01_Sample-X.csv
                        content_blobs:
                        - url: https://example.com/file.csv
                          content_type: text/csv
                      relationships:
                        projects:
                          data:
                          - id: '560'
                            type: projects
                  summary: Create DataFile
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFileSingleResponse'
              examples:
                CreateDataFile:
                  value:
                    data:
                      type: data_files
                      attributes:
                        title: DF-20240101-01_Sample-X.csv
                        content_blobs:
                        - url: https://example.com/file.csv
                          content_type: text/csv
                      relationships:
                        projects:
                          data:
                          - id: '560'
                            type: projects
                  summary: Create DataFile
          description: ''
  /nextseek_api/data_files/{uid}/:
    get:
      operationId: Fetch a DataFile
      description: 'Fetch metadata for a specific data file by ID or name. Returns
        title, description, file type, download URL, version history, and linked samples
        or assays. Specify version number to retrieve historical file revisions. Examples:
        ''Get the CT scan images for this monkey''; ''Show me the flow cytometry results
        file for sample NHP-220630FLY-1-PUB'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric) or NExtSEEK UID (string)
        required: true
      - in: query
        name: version
        schema:
          type: integer
          default: 1
        description: Required DataFile version to fetch
        required: true
      tags:
      - DataFiles
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFileSingleResponse'
              examples:
                GetDataFile:
                  value:
                    data:
                      id: '560'
                      type: data_files
                      attributes:
                        title: DF-20240101-01_Sample-X.csv
                      relationships: {}
                      links:
                        self: /data_files/560
                      meta: {}
                    jsonapi:
                      version: '1.0'
                  summary: Get DataFile
          description: ''
    patch:
      operationId: Update a DataFile
      description: 'Update an existing data file''s metadata by ID or name. Modify
        title, description, or project/assay associations. Returns the updated file
        record with all current metadata. Examples: ''Add a description to the microscopy
        images''; ''Change the project association for this sequencing file'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric) or NExtSEEK UID (string)
        required: true
      tags:
      - DataFiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDataFileUpdateRequest'
            examples:
              PatchDataFile:
                value:
                  data:
                    type: data_files
                    id: '560'
                    attributes:
                      description: Updated description
                summary: Patch DataFile
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDataFileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDataFileUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFileSingleResponse'
              examples:
                PatchDataFile:
                  value:
                    data:
                      type: data_files
                      id: '560'
                      attributes:
                        description: Updated description
                  summary: Patch DataFile
          description: ''
  /nextseek_api/investigations/:
    get:
      operationId: List Investigations
      description: 'Retrieve all investigations (research topics or themes) you have
        access to. Returns investigation titles, descriptions, and IDs for their parent
        projects and child studies. Examples: ''Show me all ongoing investigations'';
        ''What research topics are being studied in the primate project?'''
      tags:
      - Investigations
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestigationListResponse'
              examples:
                ListInvestigations:
                  value:
                  - data:
                    - id: '763'
                      type: investigations
                      attributes:
                        title: My Investigation
                      links:
                        self: /investigations/763
                    jsonapi:
                      version: '1.0'
                    links:
                      self: /investigations?page[number]=1&page[size]=100
                    meta:
                      base_url: https://fairdata-dev.mit.edu
                      api_version: v1
                  summary: List Investigations
          description: ''
    post:
      operationId: Create an Investigation
      description: 'Create a new investigation (research topic) within a project.
        Define the title, description, and objectives. Returns the created investigation
        with its assigned ID and metadata. Examples: ''Create a new investigation
        for studying vaccine efficacy''; ''Add a research topic about tumor microenvironment
        to the cancer project'''
      tags:
      - Investigations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationCreateRequest'
            examples:
              CreateInvestigation:
                value:
                  data:
                    type: investigations
                    attributes:
                      title: My Investigation
                    relationships:
                      projects:
                        data:
                        - type: projects
                          id: '4475'
                summary: Create Investigation
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvestigationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvestigationCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSingleResponse'
              examples:
                CreateInvestigation:
                  value:
                    data:
                      type: investigations
                      attributes:
                        title: My Investigation
                      relationships:
                        projects:
                          data:
                          - type: projects
                            id: '4475'
                  summary: Create Investigation
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSingleResponse'
              examples:
                CreateInvestigation:
                  value:
                    data:
                      type: investigations
                      attributes:
                        title: My Investigation
                      relationships:
                        projects:
                          data:
                          - type: projects
                            id: '4475'
                  summary: Create Investigation
          description: ''
  /nextseek_api/investigations/{uid}/:
    get:
      operationId: Fetch an Investigation
      description: 'Fetch details for a specific investigation by its ID. Returns
        full metadata including title, description, objectives, linked project, and
        all associated studies. Examples: ''Show me the details of the immune response
        investigation''; ''What studies are part of this research topic?'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric). Non-numeric UID resolution not configured.
        required: true
      tags:
      - Investigations
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSingleResponse'
              examples:
                GetInvestigation:
                  value:
                    data:
                      id: '763'
                      type: investigations
                      attributes:
                        title: My Investigation
                      relationships:
                        projects:
                          data: []
                      links:
                        self: /investigations/763
                      meta: {}
                    jsonapi:
                      version: '1.0'
                  summary: Get Investigation
          description: ''
    patch:
      operationId: Update an Investigation
      description: 'Update an existing investigation by its ID. Modify title, description,
        objectives, or project association. Returns the updated investigation with
        all current metadata. Examples: ''Rename the vaccine study investigation'';
        ''Update the objectives for the immune response research topic'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric). Non-numeric UID resolution not configured.
        required: true
      tags:
      - Investigations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvestigationUpdateRequest'
            examples:
              PatchInvestigation:
                value:
                  data:
                    id: '763'
                    type: investigations
                    attributes:
                      title: Revised Title
                summary: Patch Investigation
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInvestigationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInvestigationUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSingleResponse'
              examples:
                PatchInvestigation:
                  value:
                    data:
                      id: '763'
                      type: investigations
                      attributes:
                        title: Revised Title
                  summary: Patch Investigation
          description: ''
  /nextseek_api/people/:
    get:
      operationId: List People
      description: 'Retrieve all registered researchers and users in the system. Returns
        names, email addresses, institutions, and IDs for their associated projects,
        studies, and contributions. Examples: ''Show me all researchers in the system'';
        ''Who are the scientists working on primate studies?'''
      tags:
      - People
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonListResponse'
              examples:
                ListPeople:
                  value:
                  - data:
                    - id: '1652'
                      type: people
                      attributes:
                        title: Doe, John
                      links:
                        self: /people/1652
                    jsonapi:
                      version: '1.0'
                    links:
                      self: /people?page[number]=1&page[size]=100
                    meta:
                      base_url: http://localhost:3000
                      api_version: v1
                  summary: List People
          description: ''
    post:
      operationId: Create a Person
      description: 'Register a new researcher or user in the system with their name,
        email, and institution. Returns the created person record with their assigned
        ID. Examples: ''Add a new researcher named Jane Doe to the system''; ''Register
        a collaborator from the partner institution'''
      tags:
      - People
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreateRequest'
            examples:
              CreatePerson:
                value:
                  data:
                    type: people
                    attributes:
                      first_name: Post
                      last_name: User
                      email: x@y
                summary: Create Person
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSingleResponse'
              examples:
                CreatePerson:
                  value:
                    data:
                      type: people
                      attributes:
                        first_name: Post
                        last_name: User
                        email: x@y
                  summary: Create Person
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSingleResponse'
              examples:
                CreatePerson:
                  value:
                    data:
                      type: people
                      attributes:
                        first_name: Post
                        last_name: User
                        email: x@y
                  summary: Create Person
          description: ''
  /nextseek_api/people/{uid}/:
    get:
      operationId: Fetch a Person
      description: 'Fetch profile details for a specific researcher by their ID. Returns
        full metadata including name, email, institution, and all linked projects,
        studies, assays, data files, and publications they have contributed to. Examples:
        ''Show me Dr. Smith''s profile and projects''; ''What studies has this researcher
        contributed to?'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric)
        required: true
      tags:
      - People
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSingleResponse'
              examples:
                GetPerson:
                  value:
                    data:
                      id: '1652'
                      type: people
                      attributes:
                        title: Doe, John
                      relationships:
                        projects:
                          data: []
                        institutions:
                          data: []
                        investigations:
                          data: []
                        studies:
                          data: []
                        assays:
                          data: []
                        data_files:
                          data: []
                        documents:
                          data: []
                        models:
                          data: []
                        sops:
                          data: []
                        publications:
                          data: []
                        events:
                          data: []
                        presentations:
                          data: []
                        collections:
                          data: []
                        workflows:
                          data: []
                      links:
                        self: /people/1652
                      meta: {}
                    jsonapi:
                      version: '1.0'
                  summary: Get Person
          description: ''
    patch:
      operationId: Update a Person
      description: 'Update an existing researcher''s profile by their ID. Modify name,
        email, institution, or project associations. Returns the updated person record
        with all current metadata. Examples: ''Update Dr. Smith''s email address'';
        ''Change the institution for this researcher'''
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        description: SEEK id (numeric)
        required: true
      tags:
      - People
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonUpdateRequest'
            examples:
              PatchPerson:
                value:
                  data:
                    type: people
                    id: '1652'
                    attributes:
                      first_name: Patched
                summary: Patch Person
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPersonUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPersonUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSingleResponse'
              examples:
                PatchPerson:
                  value:
                    data:
                      type: people
                      id: '1652'
                      attributes:
                        first_name: Patched
                  summary: Patch Person
          description: ''
  /nextseek_api/projects/:
