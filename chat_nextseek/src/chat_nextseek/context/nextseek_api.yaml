  /nextseek_api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /nextseek_api/schema_rag/ingest/:
    post:
      operationId: Ingest OpenAPI Schema
      description: Ingest an OpenAPI schema from a URL for RAG retrieval. Creates
        a session that can be used for subsequent retrieve calls. The session has
        a configurable TTL (default 15 minutes).
      tags:
      - Schema RAG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
            examples:
              IngestSEEKOpenAPISchema:
                value:
                  schema_url: https://fairdomhub.org/api/definitions/openapi-v3-resolved.yaml
                  ttl_minutes: 30
                summary: Ingest SEEK OpenAPI Schema
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IngestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngestRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              examples:
                IngestSuccessResponse:
                  value:
                    session_id: abc123def456
                    schema_url: https://fairdomhub.org/api/definitions/openapi-v3-resolved.yaml
                    ttl_minutes: 30
                    expires_at: '2024-01-15T12:30:00Z'
                    num_endpoints: 150
                  summary: Ingest Success Response
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Schema too large - exceeds maximum endpoint limit
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Authentication required
          description: ''
        '422':
          content:
            application/json:
              schema:
                description: Invalid request payload
          description: ''
        '502':
          content:
            application/json:
              schema:
                description: Failed to fetch or parse schema from URL
          description: ''
  /nextseek_api/schema_rag/retrieve/:
    post:
      operationId: Retrieve API Endpoints
      description: Retrieve relevant API endpoints from an ingested schema using semantic
        search. Uses multi-pass scoring with embedding similarity and optional term
        boosting. Returns endpoints in minimal or full mode based on request.
      tags:
      - Schema RAG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
            examples:
              RetrieveBySessionID:
                value:
                  session_id: abc123def456
                  query: How do I create a new sample?
                  mode: minimal
                  top_k: 5
                  include_debug: true
                summary: Retrieve by Session ID
              RetrieveBySchemaURL:
                value:
                  schema_url: https://fairdomhub.org/api/definitions/openapi-v3-resolved.yaml
                  query: Get all projects for a user
                  mode: full
                  top_k: 3
                  resolved_terms:
                    project: research project
                    user: person
                summary: Retrieve by Schema URL
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'
              examples:
                MinimalModeResponse:
                  value:
                    session_id: abc123def456
                    mode: minimal
                    endpoints_minimal:
                    - operationId: createSample
                      method: POST
                      path: /samples
                      tags:
                      - Samples
                      description: Create a new sample
                    debug:
                      used_fallback_full: false
                      used_enriched_minimal_examples: false
                      similarity_threshold_effective: 0.7
                      num_candidates_initial: 150
                      num_candidates_final: 1
                      scores:
                      - 0.85
                  summary: Minimal Mode Response
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Authentication required
          description: ''
        '422':
          content:
            application/json:
              schema:
                description: Invalid request payload
          description: ''
