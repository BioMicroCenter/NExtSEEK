    post:
      operationId: Advanced Search Samples
      description: 'Search samples by type, attribute filters, and text matching.
        Supports multiple sample types, attribute-based filtering, and partial/exact
        match modes. Returns paginated list of matching samples with full metadata.
        Can also retrieve all samples of a given type by leaving filter fields empty.
        Examples: ''Group all monkeys by sex and necropsy date''; ''Find all mice
        from water study that were treated with NDMA''; ''Show me all samples associated
        with T cell depletion''; ''Create a barplot comparing the fraction of tumor
        values for all DFCI3 patient biopsies''; ''How many monkeys have both CT scan
        data and sequencing data?'''
      parameters:
      - in: query
        name: debug_validation
        schema:
          type: boolean
        description: Include validation error details in 502 response
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page (default 100, max 1000)
      tags:
      - Samples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleAdvancedSearchRequest'
            examples:
              NumericSampletype:
                value:
                  sampletype: '2'
                  filter_searchText: lung
                  attribute: Organ
                  filter_matchType: PARTIAL
                summary: Numeric sampletype
              MultipleSampletypesAndSingleAttribute:
                value:
                  sampletype:
                  - TIS
                  - CEL
                  filter_searchText: lung
                  attribute: Name
                  filter_matchType: PARTIAL
                summary: Multiple sampletypes and single attribute
              AttributeListWithANDLogic:
                value:
                  sampletype:
                  - TIS
                  filter_searchText: lung
                  attribute:
                  - Organ
                  - Name
                  attribute_logic: AND
                  filter_matchType: PARTIAL
                summary: Attribute list with AND logic
              SearchTextOnly:
                value:
                  filter_searchText: CD8 Depletion
                  filter_matchType: PARTIAL
                summary: Search Text Only
              MultipleSearchTextsAND(noAttributes,NoSampleTypes):
                value:
                  filter_searchText:
                  - lung
                  - granuloma
                  searchText_logic: AND
                  filter_matchType: PARTIAL
                summary: Multiple search texts AND (no attributes, no sample types)
              MultipleSearchTextsOR(noAttributes):
                value:
                  filter_searchText:
