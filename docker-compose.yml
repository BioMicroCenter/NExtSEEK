services:
  nextseek:
    build: .
    container_name: nextseek
    restart: always
    env_file:
      - ./docker/db.env
      - ./docker/nextseek.env
    depends_on:
      - seek
      - db
    volumes:
      - nextseek-static-files:/static
      # :z relabels the host path for SELinux-enforcing hosts (Fedora/RHEL).
      # No-op on macOS/Ubuntu/non-SELinux systems, so safe everywhere.
      - ./themes/NextSeek:/app/themes/NextSeek:z
      - ./dmac/local_settings.py:/app/dmac/local_settings.py:z
      - ./outputs:/app/outputs:z
      - ./logs:/app/logs:z
      # Additive (Container-CC route): lets the assistant worker spawn sibling
      # `claude` containers on the host Docker daemon. Used only by the new
      # cc-assistant endpoints; the existing assistant never touches it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Container-CC artifact flow (per dmac SDS §5.5): the host-side copier runs
      # in THIS container, so the user's scratch + Dropbox output dir are mounted
      # here for it to read scratch and publish artifacts. Sources are host paths
      # (defaults target the dev instance; override via DMAC_HOST_* env). Must
      # match cc_config (scratch_mount=/dmac/scratch, output_mount=/dmac/output).
      - ${DMAC_HOST_SCRATCH_ROOT:-/srv/dmac/scratch}:/dmac/scratch
      - ${DMAC_HOST_OUTPUT_ROOT:-/srv/dmac/output}:/dmac/output
      # Container-CC --resume (Step 1b): per-(user,session) .claude transcript
      # store. Mirrors the scratch bind. The nextseek worker mkdir's the
      # per-session dir here (DMAC_CC_STATE_MOUNT=/dmac/cc-state) and the sibling
      # agent mounts <DMAC_HOST_CC_STATE_ROOT>/<user>/<session> -> /home/user/.claude
      # so transcripts survive the ephemeral per-turn containers. Both env vars
      # are set in docker/nextseek.env; host_cc_state_root must equal this bind
      # source or --resume silently never engages.
      - ${DMAC_HOST_CC_STATE_ROOT:-/srv/dmac/cc-state}:/dmac/cc-state

  nextseek_nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:${NEXTSEEK_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - nextseek-static-files:/static:ro
    depends_on:
      - nextseek

  db: # Database implementation, in this case MySQL
    image: mysql:8.0
    container_name: seek-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-error-verbosity=1
    restart: always
    stop_grace_period: 1m30s
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - ./docker/db.env
    volumes:
      - ./docker/scripts/db:/docker-entrypoint-initdb.d:z
      - seek-mysql-db:/var/lib/mysql

  neo4j:
    image: neo4j
    container_name: neo4j
    restart: always
    volumes:
      - neo4j-data:/data
    environment:
      NEO4J_AUTH: "neo4j/demopassword"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"

  seek:
    image: fairdom/seek:1.15.1

    container_name: seek
    command: docker/entrypoint.sh
    restart: always
    environment:
      RAILS_ENV: production
      SOLR_PORT: 8983
      SOLR_HOST: solr
      NO_ENTRYPOINT_WORKERS: 1
      RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
    env_file:
      - ./docker/db.env
    volumes:
      - seek-filestore:/seek/filestore
      - seek-cache:/seek/tmp/cache
    ports:
      - "127.0.0.1:${SEEK_PORT:-3000}:3000"
    depends_on:
      - db
      - solr
    links:
      - db
      - solr

  seek_workers: # The SEEK delayed job workers
      #build: .

      image: fairdom/seek:1.15.1
      container_name: seek-workers
      command: docker/start_workers.sh
      restart: always
      environment:
        RAILS_ENV: production
        SOLR_PORT: 8983
        SOLR_HOST: solr
        RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
        QUIET_SUPERCRONIC: 1 # remove to show supercronic activity logs
      env_file:
        - ./docker/db.env
      volumes:
        - seek-filestore:/seek/filestore
        - seek-cache:/seek/tmp/cache
      depends_on:
        - db
        - solr
      links:
        - db
        - solr

  solr:
    image: fairdom/seek-solr:8.11
    container_name: seek-solr
    restart: always
    environment:
      SOLR_JAVA_MEM: -Xms512m -Xmx1024m
    volumes:
      - seek-solr-data:/var/solr/
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - seek
      - /opt/solr/server/solr/configsets/seek_config


volumes:
  seek-filestore:
    external: true
  seek-mysql-db:
    external: true
  seek-solr-data:
    external: true
  seek-cache:
    external: true
  nextseek-static-files:
    external: true
  neo4j-data:
    external: true
