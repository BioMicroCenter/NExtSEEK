services:
  # The app image runs in two services (SPEC-PLAN section 1). `nextseek` is the
  # WORKER: the nine background loops (docker/scripts/entrypoint.sh worker), the
  # only migrator, no web server. It keeps the name and container_name so every
  # `docker exec nextseek manage.py ...` still works. `web` (below) is the web
  # server, which `./startup.sh rebuild` replaces without a gap.
  nextseek:
    build: .
    # Every app-code process below runs this same image. COMPOSE_PROJECT_NAME
    # keeps canonical and port-offset instances isolated from one another.
    image: ${COMPOSE_PROJECT_NAME:-nextseek}-nextseek:latest
    container_name: ${INSTANCE_PREFIX:-}nextseek
    restart: always
    command: ["/app/docker/scripts/entrypoint.sh", "worker"]
    environment:
      # The CC upload task writes into the per-user trees of this volume by name.
      # Same INSTANCE_PREFIX the volume itself carries (see `web`).
      DMAC_CC_USERS_VOLUME: ${INSTANCE_PREFIX:-}dmac-cc-users
      # Kept interpolated HERE, not just read inside the container, so the knob
      # stays where it was. It used to sit in attribute_mutation_worker's
      # `command:`, where Compose expanded it from the host environment or the
      # project-root `.env`; the entrypoint now reads it from the container's
      # environment instead. Without this line an operator who sets it the way
      # the old service documented would get the default and no error.
      ATTRIBUTE_MUTATION_WORKER_CONCURRENCY: ${ATTRIBUTE_MUTATION_WORKER_CONCURRENCY:-1}
      # The loops' calls to the app's own REST API used to hit 127.0.0.1:8000.
      # This container no longer serves, so they go through the front door.
      NEXTSEEK_INTERNAL_BASE_URL: http://nextseek_nginx
      # Where the dev-only labs file is read from: on a volume shared with `web`,
      # written once by the deploy runner, so no restart is needed to pick it up.
      NEXTSEEK_LABS_FILE: /media/context/labs_db.json
      # The worker never talks to cc-spawner. docker/nextseek.env carries the
      # spawner token for `web`; these empty values beat the env_file, so the
      # worker holds no token and no spawner address.
      NEXTSEEK_SPAWNER_TOKEN: ""
      NEXTSEEK_SPAWNER_URL: ""
    env_file:
      - ./docker/db.env
      - ./docker/nextseek.env
    depends_on:
      seek:
        condition: service_started
      db:
        condition: service_healthy
    # What the worker does NOT mount, on purpose: the Docker socket, laya-net, the
    # luria key and ssh dir, and the static volume. Only the chat turn (a `web`
    # process) launches CC containers, SEEK user admin and Luria pipelines; no
    # loop imports them (cc_engine.py and seek_rails_runner.py are the only
    # `docker` importers, ssh.py is reached from the assistant only).
    volumes:
      # :z relabels the host path for SELinux-enforcing hosts (Fedora/RHEL).
      # No-op on macOS/Ubuntu/non-SELinux systems, so safe everywhere.
      - ./themes/NextSeek:/app/themes/NextSeek:z
      - ./dmac/local_settings.py:/app/dmac/local_settings.py:z
      - ./outputs:/app/outputs:z
      - ./logs:/app/logs:z
      # Container-CC user trees (G7-10). Persisted in the external named volume
      # `dmac-cc-users` (same pattern as seek-filestore) — NOT a host bind, so
      # no manual host mkdir/chmod is ever required and data survives
      # `docker compose up`/recreate (lost only on `down -v` / `startup.sh reset`).
      # The worker mounts it for the CC upload Celery task, which moves a
      # user's files into their input tree.
      - dmac-cc-users:/dmac/users
      # The `attribute_mutations` Celery broker, mounted here because the
      # attribute worker and the outbox dispatcher are processes of THIS
      # container (docker/scripts/entrypoint.sh) rather than services of their
      # own. Only those two processes get CELERY_BROKER_URL pointed at it; the
      # batch_upload worker keeps the default under /var/celery, which is its own
      # volume: a queued upload (broker, results, owner index, saved sheet)
      # survives a recreate. `web` mounts /var/celery too, to enqueue uploads.
      - attribute_mutation_broker:/var/lib/attribute-broker
      - batch_upload_state:/var/celery
      # MEDIA_ROOT, shared with `web`: the worker writes upload reports here and
      # web serves and reads them, and two web containers during a swap must
      # see the same export files. A named volume, so a rebuild no longer wipes it.
      - nextseek-media:/media
    # Non-root (uid/gid 10001, the user the image creates; host uid 1001 is a person), no capabilities, no setuid
    # escalation. group_add is the deploy account's gid, so the app can read local_settings.py and the Luria key (mode 0640).
    user: "10001:10001"
    group_add:
      - "${NEXTSEEK_HOST_GID:?is missing from .env: add it with echo NEXTSEEK_HOST_GID=`id -g` >> .env}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # One probe for the four background runtimes this container carries
    # (docker/scripts/attribute_runtime_healthcheck.py app). Nothing gates on this
    # container's health (`nextseek_nginx` depends on it by start-order only, and
    # startup never passes `--wait`), so an unhealthy status reports the failure
    # without taking the site down with it. The web server lives in `web` and has
    # its own probe.
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/docker/scripts/attribute_runtime_healthcheck.py", "app"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Capped like every long-lived service (a runaway process is killed inside the
    # container instead of filling the host). memswap_limit equal to the cap means
    # no swap on top of it. At rest the loops and their Celery children hold about
    # 5.3 GiB, so 8G leaves room; tune it per box with NEXTSEEK_WORKER_MEMORY in the
    # project-root .env (pinned by nextseek_api/tests/repo_guards/test_compose_app_memory_cap.py).
    deploy:
      resources:
        limits:
          memory: "${NEXTSEEK_WORKER_MEMORY:-8G}"
    memswap_limit: "${NEXTSEEK_WORKER_MEMORY:-8G}"

  # The web server (gunicorn or daphne, docker/scripts/entrypoint.sh web). Same
  # image as `nextseek` (no second build) and NO container_name: compose names
  # it nextseek-web-N, which is what lets a rebuild run two at once and swap them
  # (startup/lib/web_swap.py). The chat turn runs here, so this service carries
  # everything a turn touches: dmac-spawner-net (CC containers and the SEEK admin
  # scripts run in cc-spawner, the only service with the Docker socket), laya-net,
  # the luria key and ssh dir, and the CC user trees.
  web:
    image: ${COMPOSE_PROJECT_NAME:-nextseek}-nextseek:latest
    # Built by `nextseek` above; never looked up in a registry under that name.
    pull_policy: never
    restart: always
    command: ["/app/docker/scripts/entrypoint.sh", "web"]
    # A stopping web container takes no new chat turns, lets running ones finish
    # (NEXTSEEK_DRAIN_SECONDS, 240 s by default), cuts the rest with a plain
    # message, then stops gunicorn (its own 30 s). 5m covers all of it
    # (pinned by nextseek_api/tests/repo_guards/test_compose_web_service.py).
    stop_grace_period: 5m
    environment:
      DMAC_CC_USERS_VOLUME: ${INSTANCE_PREFIX:-}dmac-cc-users
      NEXTSEEK_DRAIN_SECONDS: ${NEXTSEEK_DRAIN_SECONDS:-240}
      NEXTSEEK_LABS_FILE: /media/context/labs_db.json
      # Private sample exports (seek/views/exports.py) on the shared volume, so a
      # link made on the old web container still answers after a swap. Outside
      # uploads/production/, the one tree /media/ serves (dmac/media.py).
      NEXTSEEK_EXPORT_ROOT: /media/private-exports
      # Where CC turns and SEEK user ops go: the cc-spawner service, the only holder
      # of the Docker socket. There is no direct Docker path; an empty value in the
      # project-root .env falls back to this default. The token is NEXTSEEK_SPAWNER_TOKEN in docker/nextseek.env (install writes it, with the
      # same value in docker/cc-spawner.env).
      NEXTSEEK_SPAWNER_URL: ${NEXTSEEK_SPAWNER_URL:-http://cc-spawner:8080}
    env_file:
      - ./docker/db.env
      - ./docker/nextseek.env
    depends_on:
      seek:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - nextseek-static-files:/static
      - ./themes/NextSeek:/app/themes/NextSeek:z
      - ./dmac/local_settings.py:/app/dmac/local_settings.py:z
      - ./outputs:/app/outputs:z
      - ./logs:/app/logs:z
      # Luria SLURM launch backend. LURIAKEY is the host path to the operator's
      # private key, bind-mounted read-only at the SAME path inside so the value
      # of LURIA_KEY needs no translation. Defaults to /dev/null so the stack
      # still comes up when the Luria backend is unused.
      - ${LURIAKEY:-/dev/null}:${LURIAKEY:-/dev/null}:ro
      # Writable ssh dir (10001-owned, 0700 in the image): holds known_hosts. ssh.py copies
      # the key to a 0600 mkstemp file in /tmp for one call (it cannot chmod the read-only
      # bind above) and removes the copy after use. The key file must be readable by group NEXTSEEK_HOST_GID (0640).
      - nextseek-luria-ssh:/app/.ssh
      # Container-CC user trees (see `nextseek`). A turn mkdirs scratch, cc-state,
      # memory and output dirs here; the sibling containers mount per-user
      # *subpaths* of this SAME volume.
      - dmac-cc-users:/dmac/users
      # Upload views enqueue batch_upload / CC upload tasks through the broker
      # under /var/celery; the worker consumes them. No attribute broker: the
      # outbox dispatcher in the worker is its sole publisher.
      - batch_upload_state:/var/celery
      - nextseek-media:/media
      # Sign-in lockout and request-rate counters (CACHES["throttle"], a file cache):
      # on a volume they survive a swap and both web containers share them.
      - nextseek-throttle:/var/tmp/nextseek-throttle
    # Non-root, as `nextseek`.
    user: "10001:10001"
    group_add:
      - "${NEXTSEEK_HOST_GID:?is missing from .env: add it with echo NEXTSEEK_HOST_GID=`id -g` >> .env}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # GET /login/ answering 200 is the same first probe CI's readiness gate uses.
    # start_interval makes a new container visible as healthy within seconds of
    # being ready, which is what the swap waits on (Engine 25+). start_period stays
    # above the entrypoint's wait for the worker's migrations
    # (NEXTSEEK_MIGRATE_WAIT_SECONDS, 300 s), so a stop-first deploy that migrates
    # does not report web unhealthy while it waits.
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 330s
      start_interval: 2s
    # With no cap, one gunicorn worker serving a broad search grew to 6-11 GB,
    # filled the host's RAM and swap, and took every container and sshd down
    # with it. Capped, the kernel kills that process inside this container
    # instead: gunicorn respawns the worker, and `restart: always` covers the
    # rest. memswap_limit equal to the cap means no swap on top of it. The web
    # process holds about 3.7 GiB at rest; during a swap two run for a few
    # minutes. Tune it per box with NEXTSEEK_MEMORY in the project-root .env
    # (pinned by nextseek_api/tests/repo_guards/test_compose_app_memory_cap.py).
    deploy:
      resources:
        limits:
          memory: "${NEXTSEEK_MEMORY:-8G}"
    memswap_limit: "${NEXTSEEK_MEMORY:-8G}"
    # JevLevROUTING: the laya router sidecar is reachable only over the
    # internal `laya-net`. No depends_on on it: it is off by default (profile
    # `laya`) and the app reads a missing sidecar as "laya off" for the turn.
    # dmac-spawner-net reaches the cc-spawner (token-authenticated).
    networks:
      - default
      - laya-net
      - dmac-spawner-net

  # The CC spawner (W9-DESIGN): the one service that holds the Docker socket for
  # CC turns and the SEEK admin scripts, behind a token and a small fixed API, so
  # `web` can no longer name an image, a mount, a network or a privilege. Built
  # from its own folder; reachable only on the internal dmac-spawner-net (no
  # `ports:`, ever). Its only secret is SPAWNER_TOKEN in docker/cc-spawner.env,
  # which install writes with the same value as NEXTSEEK_SPAWNER_TOKEN.
  cc-spawner:
    build:
      context: ./docker/cc-spawner
    image: nextseek-cc-spawner:latest
    # No container_name, like laya-router: the INSTANCE_PREFIX names are a pinned set
    # (merge-survival S7), and the app reaches it by its service name.
    restart: unless-stopped
    # python as PID 1 ignores SIGTERM (no handler), so every stop waited 10 s and
    # ended in SIGKILL; the init hands the signal on.
    init: true
    # required: false so every other compose verb still parses on a box that has
    # not run install or rebuild since this service arrived (both write the file);
    # the spawner itself refuses to start without a token.
    env_file:
      - path: ./docker/cc-spawner.env
        required: false
    # Passed by name, never `env_file: nextseek.env`: the spawner must not hold the
    # app's secrets. Compose reads the project-root `.env`, NOT docker/nextseek.env,
    # so a box that overrides a NEXTSEEK_CC_* limit in nextseek.env must copy it to
    # `.env` too. Defaults equal cc_engine's.
    environment:
      DMAC_CC_USERS_VOLUME: ${INSTANCE_PREFIX:-}dmac-cc-users
      NEXTSEEK_CC_IMAGE: dmac-assistant:poc
      NEXTSEEK_CC_NETWORK: dmac-cc-net
      SEEK_CONTAINER: ${INSTANCE_PREFIX:-}seek
      NEXTSEEK_CC_MAX_TURNS: ${NEXTSEEK_CC_MAX_TURNS:-50}
      NEXTSEEK_CC_MEM_LIMIT: ${NEXTSEEK_CC_MEM_LIMIT:-4g}
      NEXTSEEK_CC_NANO_CPUS: ${NEXTSEEK_CC_NANO_CPUS:-2000000000}
      NEXTSEEK_CC_PIDS_LIMIT: ${NEXTSEEK_CC_PIDS_LIMIT:-512}
      NEXTSEEK_CC_FSIZE_BYTES: ${NEXTSEEK_CC_FSIZE_BYTES:-10737418240}
      NEXTSEEK_INTERNAL_BASE_URL: http://nextseek_nginx
      NEO4J_URI: ${CC_SPAWNER_NEO4J_URI:-neo4j://neo4j:7687}
      NEXTSEEK_CC_AUTOMODE_GCP: ${NEXTSEEK_CC_AUTOMODE_GCP:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: "${SPAWNER_MEMORY:-512M}"
    memswap_limit: "${SPAWNER_MEMORY:-512M}"
    networks:
      - dmac-spawner-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  nextseek_nginx:
    image: nginx:${NGINX_IMAGE_TAG:-1.31.2}
    # The front door: every user and the smoke suite arrive through this port.
    # A manual `docker stop` still keeps it down, so `./startup.sh rebuild`
    # also starts it (never recreates it) after restarting the app.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXTSEEK_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro,z
      # Drop-ins, included by nginx.conf as /etc/nginx/optional/*.conf. One ships
      # enabled, error-pages.conf (the page shown instead of a bare 502 while the
      # app restarts; a directory mount, so a new version needs only `nginx -s
      # reload`). The rest ship as *.conf.example, inert until an operator copies
      # one to *.conf. See docker/nginx-optional/neo4j.conf.example.
      - ./docker/nginx-optional:/etc/nginx/optional:ro,z
      # The swap's pin (`set $upstream "<container>";`), written by
      # startup/lib/web_swap.py only while two web containers run. Generated
      # content, gitignored; a directory mount so a new pin needs only a reload.
      - ./docker/nginx-upstream:/etc/nginx/upstream:ro,z
      - nextseek-static-files:/static:ro
    depends_on:
      - web
    # OI-3 / Container-CC route: nginx is the ONLY dual-homed service. It stays
    # on the default stack network (reaching `web`) and additionally joins
    # the segmented `dmac-cc-net`, where it is the sandboxed CC agent's ONLY
    # route back into NExtSEEK (see cc_engine._NEXTSEEK_SERVICE_HOST /
    # _rewrite_loopback_url). `web` and `nextseek` are deliberately NOT listed here
    # and so stay off dmac-cc-net — the de-credentialed agent must never gain L3
    # reach to `web`, `nextseek`, `db`, `seek`, `solr`, or `neo4j` directly.
    networks:
      - default
      - dmac-cc-net

  # Container-CC (CC) route sidecar: holds the institutional
  # AWS_BEARER_TOKEN_BEDROCK and adds the Authorization header server-side so
  # the agent never carries an AWS credential (OI-3). Reachable ONLY on
  # dmac-cc-net via the compose service DNS name `bedrock-proxy` (matches
  # cc_engine.DMAC_BEDROCK_PROXY_URL's default host) — never on the default
  # stack network, so it cannot be reached from db/seek/solr/neo4j either.
  # `container_name: ${INSTANCE_PREFIX:-}dmac-bedrock-proxy` is the HOST-side identity used only
  # for `docker logs`/`docker inspect`/`docker network inspect` (see
  # DMAC_PROXY_CONTAINER in test_cc_realstack.py) — never for in-network URLs.
  # The prefix (empty on prod/dev) lets a second instance coexist; the service
  # name, not the container name, is what resolves on dmac-cc-net.
  bedrock-proxy:
    build:
      context: ./NessieAI/docker/bedrock-proxy
    image: nextseek-bedrock-proxy:latest
    container_name: ${INSTANCE_PREFIX:-}dmac-bedrock-proxy
    restart: always
    env_file:
      - ./NessieAI/docker/bedrock-proxy/proxy-secret.env
    networks:
      # On dmac-cc-net (internal, F1) so the agent reaches it, AND on the
      # dedicated dmac-cc-egress network so the proxy itself can still reach
      # bedrock-runtime.<region>.amazonaws.com. The agent is NOT on cc-egress,
      # so it inherits no internet path. Still never on `default` — db/seek/
      # solr/neo4j cannot reach the proxy.
      - dmac-cc-net
      - dmac-cc-egress
    # :8080 must be reachable ONLY on dmac-cc-net (R-8/gate G5) — no host
    # `ports:` publish here, ever.

  # Container-CC agent image build target ONLY. cc-spawner, which holds the
  # host docker socket, starts one ephemeral, per-turn sibling container from
  # this image when `web` asks it to (see NessieAI/cc/spawner_client.py)
  # — it is NOT a persistent compose-managed service. This stanza exists so
  # `docker compose build` (part of the canonical `docker compose build &&
  # docker compose up -d` deploy flow) produces/tags the image compose-
  # natively instead of a separate manual `docker build`/`make image-build`
  # step. `image:` is pinned to the literal NEXTSEEK_CC_IMAGE default
  # (cc_config/cc_engine.DEFAULT_IMAGE) so a fresh build always produces the
  # exact image cc_runner_available() looks for. `network_mode: none` +
  # `command: ["true"]` make an accidental `docker compose up -d` start of
  # this stanza a harmless, instantly-exiting no-op with no restart policy —
  # never a networked or long-running container.
  cc-agent:
    build:
      context: ./NessieAI/docker/cc-runtime
# BEGIN PLAN005-GEN:additional-contexts
      additional_contexts:
        chat_nextseek: ./NessieAI/chat_nextseek
        dmac_assistant_baml: ./NessieAI/dmac_assistant/baml_src
# END PLAN005-GEN:additional-contexts
    image: dmac-assistant:poc
    network_mode: none
    command: ["true"]

  # NS shared-cred sidecar (G7-11, Task 13): forwards granular per-request
  # NExtSEEK ops over a WebSocket the agent's nextseek plugin dials directly
  # (NessieAI/docker/cc-runtime/build_context/plugins/nextseek/bin/_sidecar_client.py).
  # THE COMPOSE SERVICE NAME IS THE LOAD-BEARING IDENTITY: `nextseek-sidecar`
  # MUST equal `_sidecar_client.py`'s `NEXTSEEK_SIDECAR_HOST` default — that
  # is the Docker DNS alias agents actually resolve. `container_name:
  # ${INSTANCE_PREFIX:-}nextseek-sidecar` is named only for host-side ops (`docker logs` /
  # `docker inspect` / the validator's closed-set peer check), same pattern
  # as `dmac-bedrock-proxy` above.
  #
  # OI-3: env carries ONLY the three non-secret keys below.
  # NEXTSEEK_BASE_URL is pinned to the literal dual-homed nginx entrypoint —
  # the sidecar's ONLY route back into NExtSEEK, same as the agent
  # (cc_engine._NEXTSEEK_SERVICE_HOST). Per-request user Basic auth arrives
  # inside WS frames from the agent, never via os.environ. No `ports:` —
  # reachable only inside dmac-cc-net, never the default stack network.
  #
  # Task 14 (G7-11, documented two-state flip of Task 13, Task 3/4 precedent):
  # the sidecar mounts the RESERVED top-level `_staging/` subpath of the
  # `dmac-cc-users` volume at `SIDECAR_STAGING_DIR` (long-syntax
  # `volume.subpath:` below). `_staging` is bootstrapped + chowned to uid 10001
  # (the sidecar user) by `startup/steps/volumes.py::ensure_cc_staging_dir`
  # BEFORE the sidecar ever starts (the Engine refuses to start a container
  # whose `VolumeOptions.Subpath` backing dir is absent). The sidecar can write
  # ONLY under `_staging/` — never a `{project}/{user}/` tree — so it cannot
  # deliver cross-user by construction; the trusted `cc_engine`/management
  # sweep (`NessieAI/cc/cc_staging.py`) moves completed
  # `.complete`-marked artifacts into the requesting user's own subtree.
  #
  # COMPOSE-FLOOR CONSEQUENCE (SPEC-7 conditional, PLAN-7 Task 2 iter-1 M-3):
  # because this mount uses YAML `volume.subpath:` syntax, the Compose >=2.26
  # floor now BINDS on every deploy host (Task 2's validator self-detects this
  # via `compose_config.json`). Host Compose is well above 2.26.
  nextseek-sidecar:
    build:
      context: ./NessieAI/docker/ns-sidecar
    image: nextseek-ns-sidecar:latest
    container_name: ${INSTANCE_PREFIX:-}nextseek-sidecar
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "${SIDECAR_MEMORY:-1G}"
    memswap_limit: "${SIDECAR_MEMORY:-1G}"
    environment:
      NEXTSEEK_BASE_URL: http://nextseek_nginx
      SIDECAR_STAGING_DIR: /home/sidecar/staging
      SIDECAR_WS_PORT: "8765"
    volumes:
      # `_staging` subpath of dmac-cc-users -> the sidecar's SIDECAR_STAGING_DIR.
      # Only this reserved subtree is writable to the sidecar; the trusted sweep
      # (Django, whole-volume mount at /dmac/users) reads it and delivers into
      # each user's own {project}/{user}/scratch.
      - type: volume
        source: dmac-cc-users
        target: /home/sidecar/staging
        volume:
          subpath: _staging
    networks:
      - dmac-cc-net
    # Cold-start tolerance (Task 9/10 bring-up evidence must not capture a
    # red-herring "unhealthy"): the sidecar's healthcheck GETs through
    # nginx -> Django (see NessieAI/docker/ns-sidecar/app/healthcheck.py), which is
    # legitimately unhealthy until the whole stack finishes booting.
    # start_period + retries lifted from the upstream sidecar compose
    # fragment's tolerance (dmac-assistant/sidecar/docker-compose.yml
    # @a429f13) — everything else there (networks, env files, volumes) is
    # deliberately NOT ported (the A-1 backend-network attachment is dead
    # post-T16 and forbidden here).
    healthcheck:
      test: ["CMD", "python", "-m", "sidecar.app.healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s

  # laya router sidecar (JevLevROUTING, SPEC s10). Off by default: only
  # `docker compose --profile laya up -d laya-router` starts it, so a plain
  # `up -d` and `./startup.sh rebuild` never do. Internal network only, NO
  # `ports:` (port rule), so no egress and no route from the per-turn CC agents.
  # Its only secret is LAYA_API_KEY in docker/laya.env (never nextseek.env).
  # The fine-tuned checkpoint is mounted read-only from the folder LAYA_REVISION
  # names; no weights in the image. The wrapper never logs request bodies.
  laya-router:
    build:
      context: ./docker/laya
    image: nextseek-laya-router:latest
    # No container_name: compose names it per project (like nextseek_nginx), and
    # the INSTANCE_PREFIX names are a pinned set (cc lane, merge-survival S7).
    # The app reaches it by the service name, which needs no container_name.
    profiles: ["laya"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${LAYA_CPUS:-4}"
          memory: "${LAYA_MEMORY:-3500M}"
    memswap_limit: "${LAYA_MEMORY:-3500M}"
    env_file:
      - ./docker/laya.env
    environment:
      LAYA_THREADS: "4"
      HF_HUB_OFFLINE: "1"
      LAYA_MODEL_DIR: /models
      LAYA_REVISION: "${LAYA_REVISION:-unset}"
    volumes:
      - ./docker/laya/models/${LAYA_REVISION:-unset}:/models:ro,z
    networks:
      - laya-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 90s

  db: # Database implementation, in this case MySQL
    image: mysql:8.0
    container_name: ${INSTANCE_PREFIX:-}seek-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-error-verbosity=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: always
    stop_grace_period: 1m30s
    # InnoDB grows its buffer pool and per-connection buffers without a bound.
    deploy:
      resources:
        limits:
          memory: "${SEEK_DB_MEMORY:-6G}"
    memswap_limit: "${SEEK_DB_MEMORY:-6G}"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    env_file:
      - ./docker/db.env
    volumes:
      - ./docker/scripts/db:/docker-entrypoint-initdb.d:z
      - seek-mysql-db:/var/lib/mysql

  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-2026.05.0}
    container_name: ${INSTANCE_PREFIX:-}neo4j
    restart: always

    # The graph holds about 6 GB of store. Cap the container so a runaway query or
    # sync cannot take the host with it, and never let it swap past the cap
    # (pinned by nextseek_api/tests/repo_guards/test_compose_app_memory_cap.py).
    deploy:
      resources:
        limits:
          memory: "${NEO4J_MEMORY:-6G}"
    memswap_limit: "${NEO4J_MEMORY:-6G}"
    volumes:
      - neo4j-data:/data
    environment:
      # Seeds the credential on FIRST START ONLY, when the neo4j-data volume is
      # created. Changing it later does nothing: the password then lives in the
      # volume, and rotating means
      #   docker exec neo4j cypher-shell -u neo4j -p <old> \
      #     "ALTER CURRENT USER SET PASSWORD FROM '<old>' TO '<new>'"
      # followed by updating NEO4J_PASSWORD + NEXTSEEK_NEO4J_PASSWORD in
      # docker/nextseek.env and recreating `nextseek`. See
      # docs/neo4j-programmatic-access.md.
      #
      # Interpolated from the repo-root .env (gitignored; copy .env.example).
      # `:?` rather than a default on purpose: a default here would ship a known
      # credential to every install, and would silently disagree with
      # docker/nextseek.env after any rotation.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}"
      # Kill any transaction that runs longer than this. The graph agent generates
      # its Cypher with an LLM, so it is not always sane: on 2026-08-05 it emitted
      # `MATCH (m:Sample) WHERE (m)-[:DERIVED_FROM*0..]->(s) OR (s)-[...]->(m)`,
      # an unanchored scan of every Sample testing an unbounded path in both
      # directions. That never finishes. The Django thread blocks on the bolt
      # socket, and once enough of them do, the single ASGI process stops serving
      # entirely -- it wedged the whole stack twice and burned 19 benchmark arms.
      #
      # Killing the query afterwards does NOT release the threads; only a restart
      # does. So this bound is the only thing that keeps one bad generated query
      # from taking the app down with it.
      #
      # 120s is ~1800x the healthy version of that same lineage query (66ms), so
      # it fires only on the pathological case. `agents/graph.py:299,446` already
      # catch driver errors, so a terminated transaction surfaces as one failed
      # graph step rather than an outage.
      NEO4J_db_transaction_timeout: "120s"
      # Bound what one transaction may allocate. On 2026-09-16 the first graph
      # sync at schema 1.2 needed more than 512 MiB for a single 5,000-sample
      # write; against this service, which had no bound at all, it would have
      # grown into the JVM heap on a host whose swap was already full. A
      # transaction that asks for more is killed and reported to its caller.
      NEO4J_db_memory_transaction_max: "${NEO4J_TRANSACTION_MAX:-1g}"
      # Size the heap and the page cache explicitly: unset, the JVM sizes the heap
      # from host RAM and can exceed the container cap below, which would have the
      # kernel kill the database rather than the query. Together they stay inside
      # the cap with room for off-heap and index population.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-2g}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2g}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2g}"
      # Optional plugins, off unless a box opts in from its project-root .env. The image
      # ships APOC core in /var/lib/neo4j/labs at its own version and copies it into
      # plugins/ at start when named here, so enabling it needs no download:
      #   NEO4J_PLUGINS=["apoc"]
      # An empty value loads nothing, which is how every box ran before this line.
      NEO4J_PLUGINS: "${NEO4J_PLUGINS:-}"
      # Which plugin procedures and functions load. Unset, the read-only families
      # listed in .env.example load (never the loaders, periodic writers or dynamic
      # Cypher runners). Set NEO4J_PROCEDURES_ALLOWLIST to change the list.
      NEO4J_dbms_security_procedures_allowlist: "${NEO4J_PROCEDURES_ALLOWLIST:-db.*,dbms.*,tx.*,fleetManagement.*,apoc.path.*,apoc.meta.*,apoc.text.*,apoc.coll.*,apoc.agg.*,apoc.map.*,apoc.number.*,apoc.convert.*,apoc.date.*,apoc.temporal.*,apoc.node.*,apoc.label.*,apoc.any.*,apoc.math.*,apoc.stats.*}"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"

  seek:
    image: fairdom/seek:1.18

    container_name: ${INSTANCE_PREFIX:-}seek
    # The image's docker/entrypoint.sh (puma in the background, nginx in the
    # foreground), plus a recycler: every 30 s any puma worker over
    # SEEK_WORKER_MAX_MB of RSS gets SIGTERM. Puma forks a fresh worker from the
    # preloaded app at once ("booted in 0.0s") and gives the old one
    # worker_shutdown_timeout (puma's default, 30 s; the image's puma.rb does not
    # set it) to finish its request, then SIGKILLs it: a request still running
    # 30 s after its worker is recycled is cut off. A ceiling that is not a whole
    # number of MB falls back to 2500 rather than failing the container.
    # Without it the workers only grow until the cgroup sits at its cap, where on
    # 2026-10-12 every process stalled in memory reclaim and SEEK answered nothing
    # for 7 minutes until the kernel OOM-killed a worker. The loop exits 1 when the
    # entrypoint does, so `restart: always` still covers the container (pinned by
    # nextseek_api/tests/repo_guards/test_compose_seek_worker_recycler.py).
    command: ["bash", "-c", "docker/entrypoint.sh & ep=$$!; m=$${SEEK_WORKER_MAX_MB:-2500}; case $$m in ''|*[!0-9]*|0*) echo \"[seek] SEEK_WORKER_MAX_MB=$$m is not a whole number of MB; using 2500\" >&2; m=2500;; esac; while kill -0 $$ep 2>/dev/null; do sleep $${SEEK_WORKER_CHECK_S:-30} & wait -n $$ep $$!; for p in $$(pgrep -f '^puma: cluster worker'); do kb=$$(awk '/^VmRSS:/ {print $$2}' /proc/$$p/status 2>/dev/null); if [ $${kb:-0} -gt $$(( m * 1024 )) ]; then echo \"[seek] recycling puma worker $$p at $$(( kb / 1024 )) MB\" >&2; kill -TERM $$p; fi; done; done; echo '[seek] docker/entrypoint.sh exited' >&2; exit 1"]
    restart: always

    # SEEK's puma workers grow with every request they serve and never give the
    # memory back: this one reached 10 GiB on the operator's workstation on
    # 2026-09-16 and left the host with nothing. The cap makes the kernel kill a
    # runaway worker inside the container instead; puma respawns it, and
    # `restart: always` covers the container. Raise it per box with SEEK_MEMORY in
    # the project-root .env (pinned by
    # nextseek_api/tests/repo_guards/test_compose_app_memory_cap.py).
    deploy:
      resources:
        limits:
          memory: "${SEEK_MEMORY:-4G}"
    memswap_limit: "${SEEK_MEMORY:-4G}"
    environment:
      RAILS_ENV: production
      SOLR_PORT: 8983
      SOLR_HOST: solr
      NO_ENTRYPOINT_WORKERS: 1
      RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
      # The image's docker/puma.rb starts one single-threaded worker per CPU when
      # this is unset: 16 on a 16-vCPU host, each growing to 1.4-2.2 GB until the
      # cap above kills it (on 2026-10-12 one box had killed 437 in three days).
      # Raise it per box with SEEK_PUMA_WORKERS in the project-root .env (pinned by
      # nextseek_api/tests/repo_guards/test_compose_app_memory_cap.py).
      PUMA_WORKERS_NUM: "${SEEK_PUMA_WORKERS:-4}"
      # The recycler's per-worker ceiling (the command above). Set it per box with
      # SEEK_PUMA_WORKERS and SEEK_MEMORY, all three together, so that workers x
      # this plus ~0.5G for the master stays well under SEEK_MEMORY (8 x 2500 MB
      # under 24G, 6 x 2500 MB under 20G). At the defaults (4G cap) the cap is
      # reached before any worker passes 2500 MB, so the recycler never acts there.
      SEEK_WORKER_MAX_MB: "${SEEK_WORKER_MAX_MB:-2500}"
      # glibc's per-thread malloc arenas fragment a long-lived Ruby heap; 2 is the
      # usual setting for Rails. The image ships no jemalloc.
      MALLOC_ARENA_MAX: "2"
    env_file:
      - ./docker/db.env
    volumes:
      - seek-filestore:/seek/filestore
      - seek-cache:/seek/tmp/cache
      - ./docker/seek-nginx.conf:/seek/nginx.conf
    ports:
      - "127.0.0.1:${SEEK_PORT:-3000}:3000"
    depends_on:
      - db
      - solr
    links:
      - db
      - solr

  seek_workers: # The SEEK delayed job workers
      #build: .

      image: fairdom/seek:1.18
      container_name: ${INSTANCE_PREFIX:-}seek-workers
      # The image's docker/start_workers.sh ends in `tail -f`, so when the
      # delayed_job workers lose MySQL they log "MySQL client is not connected"
      # on every poll, never reconnect, and the container stays up: a
      # `docker restart seek-mysql` on 2026-10-09 left 909 jobs stuck that way.
      # This exits on the first such line instead, and `restart: always` brings
      # the workers back (start_workers.sh waits for MySQL first). `tail -n0`
      # skips lines from before this start. The process substitution lets the
      # script exit as soon as grep matches, whether or not this tail notices its
      # reader has gone (pinned by
      # nextseek_api/tests/repo_guards/test_compose_seek_workers_watchdog.py).
      command: ["bash", "-c", "docker/start_workers.sh & grep -q 'MySQL client is not connected' < <(tail -n0 -F log/production.log 2>/dev/null); echo '[seek_workers] lost MySQL: exiting so docker restarts the workers' >&2; exit 1"]
      restart: always
      environment:
        RAILS_ENV: production
        SOLR_PORT: 8983
        SOLR_HOST: solr
        RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
        QUIET_SUPERCRONIC: 1 # remove to show supercronic activity logs
        MALLOC_ARENA_MAX: "2" # same Rails heap as `seek`, same fragmentation
      # The delayed-job workers are the same Rails process as `seek` and bloat the
      # same way. On 2026-09-16 the two SEEK services together held 11.2 GiB
      # across 24 `bundle` processes when the host ran out; `seek` was capped and
      # this one was not, so the kill landed on the host instead of in here.
      deploy:
        resources:
          limits:
            memory: "${SEEK_WORKERS_MEMORY:-6G}"
      memswap_limit: "${SEEK_WORKERS_MEMORY:-6G}"
      env_file:
        - ./docker/db.env
      volumes:
        - seek-filestore:/seek/filestore
        - seek-cache:/seek/tmp/cache
      depends_on:
        - db
        - solr
      links:
        - db
        - solr

  solr:
    image: fairdom/seek-solr:8.11
    container_name: ${INSTANCE_PREFIX:-}seek-solr
    restart: always
    # SOLR_JAVA_MEM bounds the JVM heap, not the container: off-heap and page
    # cache are unbounded without this.
    deploy:
      resources:
        limits:
          memory: "${SOLR_MEMORY:-2G}"
    memswap_limit: "${SOLR_MEMORY:-2G}"
    environment:
      SOLR_JAVA_MEM: -Xms512m -Xmx1024m
    volumes:
      - seek-solr-data:/var/solr/
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - seek
      - /opt/solr/server/solr/configsets/seek_config

networks:
  # JevLevROUTING: no gateway, so the laya sidecar has no egress. Members:
  # laya-router and web only.
  laya-net:
    internal: true
  # The CC spawner's private link: no gateway, joined by `web` and `cc-spawner`
  # only. No literal `name:` (unlike dmac-cc-net, which the spawner names): it
  # stays per compose project, so two instances on one host never share the
  # `cc-spawner` alias.
  dmac-spawner-net:
    internal: true
  # Container-CC segmented network (OI-3). Compose-managed but pinned to the
  # literal name `dmac-cc-net` (no project-name prefix) so it matches
  # cc_engine.DEFAULT_NETWORK / NEXTSEEK_CC_NETWORK exactly. Members: this
  # compose file only ever attaches `bedrock-proxy` and `nextseek_nginx` — the
  # per-turn CC agent containers join it at spawn time via docker-py, not
  # through this file. No manual `docker network create`/`connect` needed.
  dmac-cc-net:
    name: dmac-cc-net
    # F1: no NAT/gateway. The per-turn agent (spawned onto this net via docker-py)
    # runs `claude --permission-mode auto` with the one-turn pass Django issues
    # (NEXTSEEK_TURN_PASS), never the user's password (NessieAI/cc/cc_engine.py
    # build_agent_environment) — an internal net removes the L3 path a
    # prompt-injected or jailbroken turn would use to exfiltrate it. bedrock-proxy
    # keeps AWS egress via dmac-cc-egress below; the agent is not on that net.
    internal: true
  # F1: egress-capable network carrying ONLY bedrock-proxy, so the proxy can reach
  # AWS Bedrock while dmac-cc-net stays internal. No other service joins this.
  dmac-cc-egress:
    name: dmac-cc-egress


volumes:
  seek-filestore:
    external: true
    name: ${INSTANCE_PREFIX:-}seek-filestore
  seek-mysql-db:
    external: true
    name: ${INSTANCE_PREFIX:-}seek-mysql-db
  seek-solr-data:
    external: true
    name: ${INSTANCE_PREFIX:-}seek-solr-data
  seek-cache:
    external: true
    name: ${INSTANCE_PREFIX:-}seek-cache
  nextseek-static-files:
    external: true
    name: ${INSTANCE_PREFIX:-}nextseek-static-files
  neo4j-data:
    external: true
    name: ${INSTANCE_PREFIX:-}neo4j-data
  # Container-CC per-project/per-user trees (G7-10). Created by
  # `./startup.sh install` (startup/steps/volumes.py REQUIRED_VOLUMES), same as
  # the six SEEK/NExtSEEK volumes above.
  # Writable ssh dir for the Luria launch backend. Compose-managed (not external
  # like the six above) because startup/steps/volumes.py does not create it and
  # it holds no seeded data — only a 0600 copy of the operator's key.
  nextseek-luria-ssh:
    name: ${INSTANCE_PREFIX:-}nextseek-luria-ssh
  # MEDIA_ROOT (/media), shared by `nextseek` and `web`. Compose-managed like
  # batch_upload_state: no install step creates it, and it holds only generated
  # files (upload reports, exports, the dev labs file). `rebuild` keeps it;
  # `startup.sh reset` drops it.
  nextseek-media:
    name: ${INSTANCE_PREFIX:-}nextseek-media
  # Throttle counters for `web` only (the worker serves no requests). Compose-managed
  # like nextseek-media; the image creates the mount point owned by 10001, so a fresh volume copies that owner.
  nextseek-throttle:
    name: ${INSTANCE_PREFIX:-}nextseek-throttle

  dmac-cc-users:
    external: true
    # Must carry INSTANCE_PREFIX like the six volumes above: volumes.py builds
    # every REQUIRED_VOLUMES entry as f"{prefix}{name}", so without this an
    # --instance install creates `{prefix}dmac-cc-users` while compose looks up
    # the bare name and silently attaches ANOTHER instance's CC user tree.
    name: ${INSTANCE_PREFIX:-}dmac-cc-users

  # Task-08 durable async orchestration: the SQLAlchemy/SQLite Celery broker
  # transport for the `attribute_mutations` queue, shared by the attribute
  # worker and the outbox dispatcher. Both are processes of the `nextseek`
  # container since 2026-09-02, but the volume stays: it is what makes this
  # queue survive a container recreate, where batch_upload's container-local
  # broker does not. Only destructive volume operations such as the
  # explicitly-confirmed `startup.sh reset` remove it. The durable MySQL
  # job/outbox records remain the application audit source of truth.
  attribute_mutation_broker:
  # The batch-upload queue's state (BATCH_UPLOAD_STATE_DIR, /var/celery):
  # broker, results, job index, saved sheets and the celery beat schedule.
  # `rebuild` keeps it; `startup.sh reset` drops it.
  batch_upload_state:
