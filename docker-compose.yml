services:
  nextseek:
    build: .
    container_name: nextseek
    restart: always
    env_file:
      - ./docker/db.env
      - ./docker/nextseek.env
    depends_on:
      - seek
      - db
    volumes:
      - nextseek-static-files:/static
      # :z relabels the host path for SELinux-enforcing hosts (Fedora/RHEL).
      # No-op on macOS/Ubuntu/non-SELinux systems, so safe everywhere.
      - ./themes/NextSeek:/app/themes/NextSeek:z
      - ./dmac/local_settings.py:/app/dmac/local_settings.py:z
      - ./outputs:/app/outputs:z
      - ./logs:/app/logs:z
      # Additive (Container-CC route): lets the assistant worker spawn sibling
      # `claude` containers on the host Docker daemon. Used only by the new
      # cc-assistant endpoints; the existing assistant never touches it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Container-CC user trees (G7-10). Persisted in the external named volume
      # `dmac-cc-users` (same pattern as seek-filestore) — NOT a host bind, so
      # no manual host mkdir/chmod is ever required and data survives
      # `docker compose up`/recreate (lost only on `down -v` / `startup.sh reset`).
      # The nextseek worker mkdirs scratch/cc-state/memory/output dirs here;
      # sibling CC containers mount per-user *subpaths* of this SAME volume
      # (VolumeOptions.Subpath) into /data/input, /data/shared, /data/scratch,
      # /home/user/.claude, and /home/user/.cc-memory/transcripts.
      - dmac-cc-users:/dmac/users

  nextseek_nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:${NEXTSEEK_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - nextseek-static-files:/static:ro
    depends_on:
      - nextseek
    # OI-3 / Container-CC route: nginx is the ONLY dual-homed service. It stays
    # on the default stack network (reaching `nextseek`) and additionally joins
    # the segmented `dmac-cc-net`, where it is the sandboxed CC agent's ONLY
    # route back into NExtSEEK (see cc_engine._NEXTSEEK_SERVICE_HOST /
    # _rewrite_loopback_url). `nextseek` itself is deliberately NOT listed here
    # and so stays default-only — the de-credentialed agent must never gain L3
    # reach to `nextseek`, `db`, `seek`, `solr`, or `neo4j` directly.
    networks:
      - default
      - dmac-cc-net

  # Container-CC (CC) route sidecar: holds the institutional
  # AWS_BEARER_TOKEN_BEDROCK and adds the Authorization header server-side so
  # the agent never carries an AWS credential (OI-3). Reachable ONLY on
  # dmac-cc-net via the compose service DNS name `bedrock-proxy` (matches
  # cc_engine.DMAC_BEDROCK_PROXY_URL's default host) — never on the default
  # stack network, so it cannot be reached from db/seek/solr/neo4j either.
  # `container_name: dmac-bedrock-proxy` is the HOST-side identity used only
  # for `docker logs`/`docker inspect`/`docker network inspect` (see
  # DMAC_PROXY_CONTAINER in test_cc_realstack.py) — never for in-network URLs.
  bedrock-proxy:
    build:
      context: ./docker/bedrock-proxy
    image: nextseek-bedrock-proxy:latest
    container_name: dmac-bedrock-proxy
    restart: always
    env_file:
      - ./docker/bedrock-proxy/proxy-secret.env
    networks:
      - dmac-cc-net
    # :8080 must be reachable ONLY on dmac-cc-net (R-8/gate G5) — no host
    # `ports:` publish here, ever.

  # Container-CC agent image build target ONLY. The nextseek Django worker
  # spawns one ephemeral, per-turn sibling container from this image directly
  # via the host docker socket (docker-py `containers.run`, see cc_engine.py)
  # — it is NOT a persistent compose-managed service. This stanza exists so
  # `docker compose build` (part of the canonical `docker compose build &&
  # docker compose up -d` deploy flow) produces/tags the image compose-
  # natively instead of a separate manual `docker build`/`make image-build`
  # step. `image:` is pinned to the literal NEXTSEEK_CC_IMAGE default
  # (cc_config/cc_engine.DEFAULT_IMAGE) so a fresh build always produces the
  # exact image cc_runner_available() looks for. `network_mode: none` +
  # `command: ["true"]` make an accidental `docker compose up -d` start of
  # this stanza a harmless, instantly-exiting no-op with no restart policy —
  # never a networked or long-running container.
  cc-agent:
    build:
      context: ./docker/cc-runtime
    image: dmac-assistant:poc
    network_mode: none
    command: ["true"]

  # NS shared-cred sidecar (G7-11, Task 13): forwards granular per-request
  # NExtSEEK ops over a WebSocket the agent's nextseek plugin dials directly
  # (docker/cc-runtime/build_context/plugins/nextseek/bin/_sidecar_client.py).
  # THE COMPOSE SERVICE NAME IS THE LOAD-BEARING IDENTITY: `nextseek-sidecar`
  # MUST equal `_sidecar_client.py`'s `NEXTSEEK_SIDECAR_HOST` default — that
  # is the Docker DNS alias agents actually resolve. `container_name:
  # nextseek-sidecar` is pinned only for host-side ops (`docker logs` /
  # `docker inspect` / the validator's closed-set peer check), same pattern
  # as `dmac-bedrock-proxy` above.
  #
  # OI-3: env carries ONLY the three non-secret keys below.
  # NEXTSEEK_BASE_URL is pinned to the literal dual-homed nginx entrypoint —
  # the sidecar's ONLY route back into NExtSEEK, same as the agent
  # (cc_engine._NEXTSEEK_SERVICE_HOST). Per-request user Basic auth arrives
  # inside WS frames from the agent, never via os.environ. No `ports:` —
  # reachable only inside dmac-cc-net, never the default stack network.
  #
  # Task 13 vs Task 14 (documented two-state, Task 3/4 precedent): this
  # service ships with NO `dmac-cc-users` mount; `SIDECAR_STAGING_DIR` points
  # at a container-local path (the upstream `config.py` only requires the
  # var to be set; `staging.py` mkdirs it lazily on first use). Download/
  # stage ops are therefore non-functional-by-design until Task 14 lands the
  # `_staging` subpath mount of `dmac-cc-users` (bootstrapped by
  # `startup/steps/volumes.py::ensure_cc_staging_dir` ahead of that mount).
  nextseek-sidecar:
    build:
      context: ./docker/ns-sidecar
    image: nextseek-ns-sidecar:latest
    container_name: nextseek-sidecar
    restart: unless-stopped
    environment:
      NEXTSEEK_BASE_URL: http://nextseek_nginx
      SIDECAR_STAGING_DIR: /home/sidecar/staging
      SIDECAR_WS_PORT: "8765"
    networks:
      - dmac-cc-net
    # Cold-start tolerance (Task 9/10 bring-up evidence must not capture a
    # red-herring "unhealthy"): the sidecar's healthcheck GETs through
    # nginx -> Django (see docker/ns-sidecar/app/healthcheck.py), which is
    # legitimately unhealthy until the whole stack finishes booting.
    # start_period + retries lifted from the upstream sidecar compose
    # fragment's tolerance (dmac-assistant/sidecar/docker-compose.yml
    # @a429f13) — everything else there (networks, env files, volumes) is
    # deliberately NOT ported (the A-1 backend-network attachment is dead
    # post-T16 and forbidden here).
    healthcheck:
      test: ["CMD", "python", "-m", "sidecar.app.healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s

  db: # Database implementation, in this case MySQL
    image: mysql:8.0
    container_name: seek-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-error-verbosity=1
    restart: always
    stop_grace_period: 1m30s
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - ./docker/db.env
    volumes:
      - ./docker/scripts/db:/docker-entrypoint-initdb.d:z
      - seek-mysql-db:/var/lib/mysql

  neo4j:
    image: neo4j
    container_name: neo4j
    restart: always
    volumes:
      - neo4j-data:/data
    environment:
      NEO4J_AUTH: "neo4j/demopassword"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"

  seek:
    image: fairdom/seek:1.15.1

    container_name: seek
    command: docker/entrypoint.sh
    restart: always
    environment:
      RAILS_ENV: production
      SOLR_PORT: 8983
      SOLR_HOST: solr
      NO_ENTRYPOINT_WORKERS: 1
      RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
    env_file:
      - ./docker/db.env
    volumes:
      - seek-filestore:/seek/filestore
      - seek-cache:/seek/tmp/cache
    ports:
      - "127.0.0.1:${SEEK_PORT:-3000}:3000"
    depends_on:
      - db
      - solr
    links:
      - db
      - solr

  seek_workers: # The SEEK delayed job workers
      #build: .

      image: fairdom/seek:1.15.1
      container_name: seek-workers
      command: docker/start_workers.sh
      restart: always
      environment:
        RAILS_ENV: production
        SOLR_PORT: 8983
        SOLR_HOST: solr
        RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
        QUIET_SUPERCRONIC: 1 # remove to show supercronic activity logs
      env_file:
        - ./docker/db.env
      volumes:
        - seek-filestore:/seek/filestore
        - seek-cache:/seek/tmp/cache
      depends_on:
        - db
        - solr
      links:
        - db
        - solr

  solr:
    image: fairdom/seek-solr:8.11
    container_name: seek-solr
    restart: always
    environment:
      SOLR_JAVA_MEM: -Xms512m -Xmx1024m
    volumes:
      - seek-solr-data:/var/solr/
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - seek
      - /opt/solr/server/solr/configsets/seek_config


networks:
  # Container-CC segmented network (OI-3). Compose-managed but pinned to the
  # literal name `dmac-cc-net` (no project-name prefix) so it matches
  # cc_engine.DEFAULT_NETWORK / NEXTSEEK_CC_NETWORK exactly. Members: this
  # compose file only ever attaches `bedrock-proxy` and `nextseek_nginx` — the
  # per-turn CC agent containers join it at spawn time via docker-py, not
  # through this file. No manual `docker network create`/`connect` needed.
  dmac-cc-net:
    name: dmac-cc-net


volumes:
  seek-filestore:
    external: true
  seek-mysql-db:
    external: true
  seek-solr-data:
    external: true
  seek-cache:
    external: true
  nextseek-static-files:
    external: true
  neo4j-data:
    external: true
  # Container-CC per-project/per-user trees (G7-10). Created by
  # `./startup.sh install` (startup/steps/volumes.py REQUIRED_VOLUMES), same as
  # the six SEEK/NExtSEEK volumes above.
  dmac-cc-users:
    external: true
