  "/workflows/{id}/git/{version}/download/{path}":
    parameters:
    - name: id
      in: path
      required: true
      description: The ID of the workflow.
      schema:
        type: integer
      example: 138
    - name: version
      in: path
      required: true
      description: The version number of the workflow.
      schema:
        type: integer
      example: 2
    - name: path
      in: path
      required: true
      description: The path of the blob (file) to download.
      schema:
        type: string
      example: assets/images/logo.png
    get:
      operationId: downloadGitBlob
      summary: Download a Git blob (file)
      description: <a name="downloadGitBlob"></a>Download the content of the identified
        Git blob (file)
      tags:
      - read
      - git
      - workflows
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/gitErrorResponse"
        '404':
          "$ref": "#/components/responses/notFound"
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/gitErrorResponse"
