paths:
  "/search":
    parameters:
    - name: q
      in: query
      required: true
      description: 'The text to search for

        '
      schema:
        type: string
      example: lactate inhibition
    - name: search_type
      in: query
      required: false
      description: The type of resource to return
      schema:
        type: string
        enum:
        - assays
        - collections
        - data_files
        - events
        - institutions
        - investigations
        - models
        - observation_units
        - people
        - presentations
        - programmes
        - projects
        - publications
        - sample_types
        - sops
        - studies
        - workflows
      example: data_files
    get:
      operationId: search
      summary: Search SEEK for a given query
      description: "<a name=\"searchOperation\"></a>**search** returns a list of references
        to resources\r\n\r\n* of the specified type\r\n* that are visible to the authenticated
        user, and\r\n* contain the specified test\r\n"
      tags:
      - search
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/searchResponse"
              examples:
                response:
                  value:
                    data:
                    - id: '1213'
                      type: data_files
                      attributes:
                        title: Lactate flux inhibition data
                      links:
                        self: "/data_files/1213"
                    - id: '70'
                      type: data_files
                      attributes:
                        title: Characterization of kinetics of the lactate dehydrogenase
                          of S. pyogenes
                      links:
                        self: "/data_files/70"
                    jsonapi:
                      version: '1.0'
                    meta:
                      base_url: https://fairdomhub.org
                      api_version: '0.1'
