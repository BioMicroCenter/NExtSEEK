# The restart page for the HOST nginx (the system nginx on the dev and prod
# servers that terminates TLS and proxies to 127.0.0.1:8000 and :3000). It is
# not used by any container: the operator installs it by hand as root, and
# DEPLOYMENT.md section 4 "Host nginx restart page" has the install and
# rollback steps. The app's own nginx has docker/nginx-optional/error-pages.conf;
# the page body below must stay identical to that one (the guard test compares).
#
# Include it once inside each proxying server block (not at http level, where a
# named location is not allowed):
#   include /etc/nginx/nextseek-restart-page.conf;
# On its own it only replaces 502s and 504s the host nginx makes itself: a 502
# when an upstream refuses the connection (the app or SEEK container is down), a
# 504 when a wedged upstream outlasts the host's proxy timeout. A 502 the
# upstream sends passes through untouched, which is what the app (:8000) needs:
# its JSON 502s and the container's own restart page must reach clients as is.
#
# For SEEK, whose inner nginx answers 502 while puma boots, add one line to
# each location that proxies to 127.0.0.1:3000, and to no other:
#   proxy_intercept_errors on;
# Only 502 and 504 have an error_page, so every other SEEK status still passes through.
#
# The page answers 502 even for a 504. Keep the status 502 and the body text/html (see error-pages.conf for why), and
# never give error_page an "=<code>".
error_page 502 504 @nextseek_restarting;

location @nextseek_restarting {
    default_type text/html;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    return 502 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NExtSEEK is not answering</title><style>body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f9;color:#1d232b}main{max-width:32rem;margin:18vh auto 0;padding:0 16px}h1{font-size:1.4rem;margin:0 0 .5rem}p{margin:0}a{color:inherit}@media (prefers-color-scheme:dark){body{background:#14181d;color:#e6e9ee}}</style></head><body><main><h1>NExtSEEK is not answering right now</h1><p>It is usually restarting, which takes under a minute. <a href="">Reload this page</a> in a minute.</p></main></body></html>';
}
