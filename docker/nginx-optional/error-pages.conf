# The page nginx shows instead of its bare "502 Bad Gateway" while the app
# container restarts (a rebuild, a recreate, a crash). It has a Reload link and
# no auto-refresh on purpose: nginx also answers 502 when a request killed its
# own worker (out of memory, or past gunicorn's timeout), and a page that re-sent
# that request every few seconds would kill the next worker too.
#
# Unlike the *.conf.example templates beside it, this drop-in is tracked and
# always on (see .gitignore).
#
# docker/nginx.conf includes this folder inside its server block, so the
# error_page below covers every location. It is a drop-in rather than an edit
# to nginx.conf because nginx.conf is a single-file bind mount that a git pull
# orphans, so changing it needs an nginx recreate; this folder is a directory
# mount, so a new version here needs only
#   docker compose exec nextseek_nginx nginx -t
#   docker compose exec nextseek_nginx nginx -s reload
#
# Keep the status 502 and the body text/html: ci/smoke/assertions.py
# check_gateway reads a non-JSON 502 as "the stack is down", and health probes
# must keep seeing a failure. Never give error_page an "=<code>". Only 502: a
# 504 means a request outlived proxy_read_timeout, not a restart.
#
# A named location with `return` answers every method; a static-file target
# would answer a POST with 405. The body must contain no dollar sign (nginx
# would read it as a variable) and no single quote.
error_page 502 @nextseek_restarting;

location @nextseek_restarting {
    default_type text/html;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    return 502 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NExtSEEK is not answering</title><style>body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f9;color:#1d232b}main{max-width:32rem;margin:18vh auto 0;padding:0 16px}h1{font-size:1.4rem;margin:0 0 .5rem}p{margin:0}a{color:inherit}@media (prefers-color-scheme:dark){body{background:#14181d;color:#e6e9ee}}</style></head><body><main><h1>NExtSEEK is not answering right now</h1><p>It is usually restarting, which takes under a minute. <a href="">Reload this page</a> in a minute.</p></main></body></html>';
}
