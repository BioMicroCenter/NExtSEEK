events {
    worker_connections  1024;  # Adjust this to your needs
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Explicit (never rely on the compiled-in default): the official nginx
    # Docker image's convention is stdout-captured logs so `docker logs`
    # shows access traffic. A future conf edit that reorganizes/removes the
    # default log path must not silently drop this — gate evidence
    # (gate_access_log_window.txt) depends on it being present.
    access_log /dev/stdout;

    # Docker's embedded DNS resolver. Forces per-request re-resolution of
    # upstream service names (with a 10s cache) instead of caching the IP
    # forever at nginx startup. Required because `docker compose up -d
    # --build nextseek` gives the new container a fresh IP, and without
    # this nginx keeps proxying to the dead one → "502 connect() failed
    # (Connection refused)" until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade plumbing: map the Upgrade header to the Connection
    # header value so the assistant websocket (ws/assistant/progress/{id}/)
    # proxies correctly to the daphne ASGI upstream. Without this nginx strips
    # the upgrade and the WS handshake returns 404 (frontend fell back to poll).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Server block
    server {
        listen       80;
        server_name  localhost;

        # Static file serving
        location /static/ {
            alias /static/;
            expires 30d;
        }

        # Proxy pass to WSGI server.
        # `set $upstream` introduces a variable, which is what triggers
        # nginx to use the resolver above. Without the variable, nginx
        # resolves `nextseek` once at startup and caches forever.
        location / {
            set $upstream "nextseek";
            proxy_pass http://$upstream:8000;
            # WebSocket support (assistant progress stream over daphne).
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            # Force a Django-safe upstream Host (RFC 1034/1035 — no
            # underscores). Otherwise the docker service name
            # `nextseek_nginx` reaches Django via `$host` and
            # request.get_host() raises DisallowedHost. Real Host is
            # preserved in X-Forwarded-Host for downstream consumers.
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
