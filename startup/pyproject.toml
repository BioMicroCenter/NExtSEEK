[project]
name = "nextseek-startup"
version = "0.1.0"
description = "Self-contained CLI for setting up and managing local NExtSEEK Docker installs."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Used by steps/seed.py:load_neo4j_dump to bulk-load the Neo4j seed via
    # parameterized UNWIND batches over the bolt driver (fast path).
    "neo4j>=5.0.0",
    "orjson>=3.11.9",
    # steps/schema_fixups.py opens a direct MySQL connection to apply the
    # managed SEEK indexes, so this CLI needs a driver of its own.
    #
    # PyMySQL, NOT mysqlclient: the root pyproject.toml records that startup/
    # is kept isolated specifically to avoid requiring "mysqlclient et al."
    # on a host with no C build toolchain. mysqlclient is a C extension and
    # fails to build without pkg-config and the MySQL dev headers, which would
    # make ./startup.sh unbootstrappable on exactly the machines that note is
    # protecting. PyMySQL is pure Python and is already a main-project dep.
    "PyMySQL>=1.1.0",
]

# `package = false` tells uv to manage deps for this directory without trying
# to build a wheel from it. The startup CLI is invoked from the repo, not
# installed as a package.
[tool.uv]
package = false

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
]
maintainer = [
    "python-dotenv>=1.0.0",
    "neo4j>=5.0.0",
]
