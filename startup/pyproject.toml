[project]
name = "nextseek-startup"
version = "0.1.0"
description = "Self-contained CLI for setting up and managing local NExtSEEK Docker installs."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Used by steps/seed.py:load_neo4j_dump to bulk-load the Neo4j seed via
    # parameterized UNWIND batches over the bolt driver (fast path).
    "neo4j>=5.0.0",
]

# `package = false` tells uv to manage deps for this directory without trying
# to build a wheel from it. The startup CLI is invoked from the repo, not
# installed as a package.
[tool.uv]
package = false

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
maintainer = [
    "python-dotenv>=1.0.0",
    "neo4j>=5.0.0",
]
