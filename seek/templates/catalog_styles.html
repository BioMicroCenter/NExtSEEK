{% comment %}
Shared styling for the five catalog pages. Included from {% block extra_head %}
by sampleTypesList, sampleTypeDetail, assaysList, assayDetail and assaySetup, so
the shape has one definition. Scoped under .cat-page so nothing here can reach the rest of
the app.
{% endcomment %}
<style>
.cat-page { max-width: 1080px; }
.cat-page .ns-page-header { margin-bottom: 1rem; }
.cat-page .ns-page-title { font-family: var(--ns-font-display); font-size: 1.8rem; font-weight: 700; color: var(--ns-ink); letter-spacing: -0.02em; margin-bottom: 0.35rem; }
.cat-page .ns-page-subtitle { font-size: 0.9rem; color: var(--ns-muted); margin: 0; }

/* Old list-grid + search styles removed; the shared catalog_table partial and
   nextseek.css own the table and its search box now. .cat-chip stays (assay detail). */

.cat-back { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: var(--ns-muted); text-decoration: none; margin-bottom: 1.25rem; }
.cat-back:hover { color: var(--ns-crimson); text-decoration: none; }

.cat-detail-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; border-bottom: 1px solid var(--ns-border); padding-bottom: 0.9rem; margin-bottom: 1.25rem; }
.cat-detail-code { font-family: var(--ns-font-mono); font-size: 1.5rem; font-weight: 700; color: var(--ns-ink); }
.cat-detail-title { font-size: 1.5rem; font-weight: 700; color: var(--ns-ink); font-family: var(--ns-font-display); letter-spacing: -0.02em; }
.cat-detail-name { font-size: 1.05rem; color: var(--ns-body); }
.cat-badge { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.1rem 0.5rem; border-radius: 11px; background: var(--ns-crimson-soft); border: 1px solid var(--ns-crimson-border); color: var(--ns-crimson); }

.cat-desc { font-size: 0.9rem; color: var(--ns-body); line-height: 1.7; white-space: pre-line; margin-bottom: 1.5rem; }

.cat-section { margin-bottom: 1.1rem; }
.cat-section-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ns-muted); display: block; margin-bottom: 0.3rem; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
.cat-chip { font-family: var(--ns-font-mono); font-size: 0.74rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 11px; border: 1px solid var(--ns-border); background: var(--ns-sidebar-bg); color: var(--ns-ink); text-decoration: none; }
a.cat-chip:hover { border-color: var(--ns-crimson-border); background: var(--ns-crimson-soft); color: var(--ns-crimson); text-decoration: none; }
.cat-chip--plain { font-family: var(--ns-font-body); font-weight: 400; color: var(--ns-muted); }
/* The word between alternatives in "MUS or PAV". Not a chip: it is not a code. */
.cat-or { font-size: 0.74rem; color: var(--ns-muted); font-style: italic; padding: 0 0.1rem; }
/* Separates one alternation group from the next: "TIS or CEX or CEL, AB or ABP" */
.cat-and { font-size: 0.74rem; color: var(--ns-muted); padding: 0 0.35rem; }
.assay-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 767.98px) { .assay-compare { grid-template-columns: 1fr; } }
.assay-compare-col { border: 1px solid var(--ns-border); border-radius: 8px; padding: 0.75rem 1rem; }

/* One assay row's fields. 24 slugs of 193 carry two of these, stacked. */
.cat-row-panel { margin-bottom: 0.5rem; }
.cat-empty { font-size: 0.85rem; color: var(--ns-muted); padding: 1.5rem 0; }
.cat-notice { background: var(--ns-crimson-soft); border: 1px solid var(--ns-crimson-border); color: var(--ns-crimson); border-radius: 5px; padding: 0.5rem 0.75rem; font-size: 0.85rem; margin-bottom: 0.75rem; }
.cat-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--ns-border); }

/* Assay setup: a chip that is also a form control. The checked treatment is
   the same crimson wash a.cat-chip already uses on hover, so a picked code
   looks like the catalog's own emphasis rather than a new idea. */
.cat-page .cat-pick { display: inline-flex; align-items: center; cursor: pointer; margin: 0; }
.cat-page .cat-pick input { position: absolute; opacity: 0; width: 0; height: 0; }
.cat-page .cat-pick input:checked + .cat-chip { border-color: var(--ns-crimson-border); background: var(--ns-crimson-soft); color: var(--ns-crimson); }
.cat-page .cat-pick input:focus-visible + .cat-chip { outline: 2px solid var(--ns-crimson); outline-offset: 1px; }
.cat-page .cat-pick input:disabled + .cat-chip { opacity: 0.45; cursor: not-allowed; }
.cat-page .cat-pick input:disabled { cursor: not-allowed; }

/* Why a code carries no sheet. Sits beside the chip, in the .cat-or voice. */
.cat-page .cat-why { font-size: 0.74rem; color: var(--ns-muted); font-style: italic; }

/* Assay setup picker. A list rather than the catalog table, because the assay
   NAME has to be the link -- the table links only its leading code cell. The
   clade banding, the group toggle, the chips and the search box are all the
   catalog's own, reused verbatim from nextseek.css; only the row shape is new,
   and it is scoped to .cat-list so nothing here reaches .cat-table. */
/* The clade bar is nextseek.css's own .clade-accent--*, on the section, so it
   runs the whole group; the head only takes the matching tint. One bar of one
   width, rather than the section's 3px doubled by a 4px of the head's own. */
.cat-page .cat-list-group { margin-bottom: 0.9rem; }
/* An <h2> for the outline, not for its size: the toggle button inside carries
   the type, and without this the heading's default font-size sets the band's
   height. */
.cat-page .cat-list-head { margin: 0; padding: 0.35rem 0.6rem; font-size: 0.8rem; line-height: 1.5; background: var(--ns-sidebar-bg); }
.cat-page .cat-list-group.clade-accent--source    .cat-list-head { background: var(--ns-clade-source-tint); }
.cat-page .cat-list-group.clade-accent--processed .cat-list-head { background: var(--ns-clade-processed-tint); }
.cat-page .cat-list-group.clade-accent--raw       .cat-list-head { background: var(--ns-clade-raw-tint); }
.cat-page .cat-list-group.clade-accent--analyzed  .cat-list-head { background: var(--ns-clade-analyzed-tint); }
.cat-page .cat-list-rows { list-style: none; margin: 0; padding: 0; }
/* The table's collapse rule is .cat-table-scoped, so the list needs its own.
   Same class, set by the same [data-group-toggle] handler. */
.cat-page .cat-list-group.is-collapsed .cat-list-rows { display: none; }
.cat-page .cat-list .cat-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.35rem 0.75rem; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--ns-border); font-size: 0.85rem; }
.cat-page .cat-list .cat-row:hover { background: #fbfbfc; }
/* The primary link. Grows to take the row, so the chips line up on the right
   at any width and wrap under the name rather than beside it when narrow. */
.cat-page .cat-assay { flex: 1 1 16rem; font-weight: 600; color: var(--ns-ink); text-decoration: none; }
.cat-page .cat-assay:hover { color: var(--ns-crimson); text-decoration: underline; }
.cat-page .cat-flow { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
.cat-page .cat-flow-side { display: inline-flex; flex-wrap: wrap; gap: 0.3rem; }
/* Kept even when one side is empty, so "TIS -> " and " -> RNA" say which side
   the codes are on. The arrow is the only thing that distinguishes them. */
.cat-page .cat-arrow { color: var(--ns-muted); font-size: 0.8rem; }
/* An assay curated with neither inputs nor outputs. The .cat-or voice: muted
   and italic, so it reads as an absence rather than as a value. */
.cat-page .cat-none { font-size: 0.78rem; color: var(--ns-muted); font-style: italic; }

/* The create form. Inputs inherit the page's type rather than the browser's. */
.cat-page .cat-field { display: block; width: 100%; max-width: 32rem; font-family: inherit; font-size: 0.9rem; color: var(--ns-ink); background: var(--ns-sidebar-bg); border: 1px solid var(--ns-border); border-radius: 5px; padding: 0.35rem 0.5rem; }
.cat-page .cat-field:focus { border-color: var(--ns-crimson-border); outline: none; }
.cat-page .cat-group { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-bottom: 0.3rem; }
.cat-page .cat-mini { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ns-muted); background: none; border: 1px dashed var(--ns-border); border-radius: 11px; padding: 0.1rem 0.5rem; cursor: pointer; }
.cat-page .cat-mini:hover { border-color: var(--ns-crimson-border); color: var(--ns-crimson); }
</style>
