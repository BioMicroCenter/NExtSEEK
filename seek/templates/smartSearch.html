{% extends "base.html" %}
{% load static %}
{% load vite_assets %}
{% block main %}
<div id="smart_search_tab" class="easyui-tabs" style="width:auto;height:calc(100vh - 60px);">
  <div title="SALT" data-options="closable:false" style="overflow:auto;padding:20px;display:none;">
        <div class="easyui-layout" style="width:auto;height:1700px;">
        <div id="north_div2" data-options="region:'north',border:false" style="width:500px; height: 700px;">
                <iframe frameBorder="0"
                                style="color-scheme:light;height:100%;width:100%;"
				src="{{ smart_search_url }}">
                </iframe>
        </div>
        </div>
  </div>
  <div title="Assistant" data-options="closable:false" style="overflow:hidden;padding:0;display:none;">
    <div id="chat-assistant-root" style="width:100%;height:calc(100vh - 110px);"></div>
  </div>
</div>
{% vite_assets "src/main.embedded.tsx" "js/chat_assistant" %}
{% endblock %}
