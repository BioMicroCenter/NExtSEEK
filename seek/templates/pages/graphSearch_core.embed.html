<script>
/* Graph Search page (/seek/graph/search/): every decision that needs no browser.

   The request body each tab sends to POST /nextseek_api/samples/graph_search/, which of
   the Simple tab's rules graph_search can express, the paging URL, the UID link, and the
   timing and error lines. No DOM, no jQuery and no template tags here:
   seek/tests/js/graph_search_cases.js runs this block verbatim under node. */
var GraphSearchCore = (function () {
  var ENDPOINT = '/nextseek_api/samples/graph_search/';

  /* The Simple tab's rules (seek/dbtable_sampleattribute.py, OPERATOR_SETS) as graph_search
     operators. Less, Greater, Before and After are inclusive there, so they map to <= and >=.
     "Not Contain" and the True/False rules have no graph_search operator and are not offered. */
  var RULES = {
    'Contain': 'CONTAINS',
    'Equal': '=',
    'Not Equal': '<>',
    'Less': '<=',
    'Before': '<=',
    'Greater': '>=',
    'After': '>=',
    'Between': 'BETWEEN'
  };
  var NUMBER = /^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/;

  function trim(s) {
    return String(s == null ? '' : s).trim();
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function offeredRules(filterType, rules) {
    return (rules || []).filter(function (rule) {
      return rule === 'No Filter' || Object.prototype.hasOwnProperty.call(RULES, rule);
    });
  }

  /* The Advanced tab: terms one per line, one AND/OR across them, an optional sample type. */
  function advancedBody(state) {
    var terms = String(state.terms == null ? '' : state.terms).split(/\r?\n/).map(trim)
      .filter(function (t) { return t.length > 0; });
    if (!terms.length) {
      return { error: 'Enter at least one search term, one per line.' };
    }
    var body = {
      filter_searchText: terms.length === 1 ? terms[0] : terms,
      searchText_logic: state.logic === 'OR' ? 'OR' : 'AND',
      filter_matchType: state.matchType === 'EXACT' ? 'EXACT' : 'PARTIAL'
    };
    var type = trim(state.sampletype);
    if (type) {
      body.sampletype = type;
    }
    return { body: body };
  }

  /* The Simple tab: one sample type, one attribute, one rule, as graph_search typed conditions.
     No attribute or "No Filter" asks for every sample of the type. */
  function simpleBody(state) {
    var type = trim(state.sampletype);
    if (!type) {
      return { error: 'Choose a sample type.' };
    }
    var attribute = trim(state.attribute);
    var rule = trim(state.rule);
    if (!attribute || attribute === 'none' || !rule || rule === 'No Filter') {
      return { body: { sampletype: type, filter_searchText: '' } };
    }
    if (!Object.prototype.hasOwnProperty.call(RULES, rule)) {
      return { error: '“' + rule + '” has no graph_search operator.' };
    }
    var from = trim(state.from);
    var to = trim(state.to);
    if (!from) {
      return { error: 'Enter a value in From.' };
    }
    if (rule === 'Between' && !to) {
      return { error: 'Between needs both a From and a To value.' };
    }
    var numeric = state.filterType === 'numeric';
    if (numeric && (!NUMBER.test(from) || (rule === 'Between' && !NUMBER.test(to)))) {
      return { error: attribute + ' needs a number.' };
    }
    function condition(op, raw) {
      return { sample_type: type, attribute: attribute, op: op, value: numeric ? Number(raw) : raw };
    }
    var where = rule === 'Between'
      ? [condition('>=', from), condition('<=', to)]
      : [condition(RULES[rule], from)];
    return { body: { filter_searchText: '', extensions: { where: where } } };
  }

  function searchUrl(page, size) {
    return ENDPOINT + '?page=' + page + '&page_size=' + size + '&debug_meta=1';
  }

  /* A datagrid formatter: the UID, escaped, linked to the sample page. */
  function uidLink(value, row) {
    return '<a href="/seek/sample/id=' + encodeURIComponent(String(row.id)) + '/">' + escapeHtml(row.uuid) + '</a>';
  }

  /* A datagrid formatter for plain text cells: EasyUI inserts cell values as HTML. */
  function textCell(value) {
    return escapeHtml(value);
  }

  function ms(x) {
    return Math.round(Number(x));
  }

  function timingText(total, wallMs, footer) {
    var n = Number(total);
    var text = n.toLocaleString('en-US') + (n === 1 ? ' sample' : ' samples') + ' in ' + ms(wallMs) + ' ms';
    var debug = null;
    (footer || []).forEach(function (item) {
      if (item && item.debug) {
        debug = item.debug;
      }
    });
    if (debug) {
      text += ' (graph_search on the server: ' + ms(debug.total_ms) + ' ms; query ' + ms(debug.cypher_ms)
        + ', count ' + ms(debug.count_ms) + ', rows ' + ms(debug.hydrate_ms) + ')';
    }
    return text;
  }

  function errorText(status, payload) {
    var detail = '';
    var errors = payload && payload.errors;
    if (errors && errors.length) {
      detail = errors[0].detail || errors[0].title || '';
    } else if (payload && payload.msg) {
      detail = payload.msg;
    }
    if (detail && typeof detail !== 'string') {
      detail = JSON.stringify(detail);
    }
    return 'graph_search answered ' + status + (detail ? ': ' + detail : '');
  }

  return {
    ENDPOINT: ENDPOINT,
    advancedBody: advancedBody,
    simpleBody: simpleBody,
    offeredRules: offeredRules,
    searchUrl: searchUrl,
    uidLink: uidLink,
    textCell: textCell,
    timingText: timingText,
    errorText: errorText
  };
})();
</script>
