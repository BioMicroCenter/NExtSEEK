<script type = "text/javascript">
/* Downloads the checked rows with their full DERIVED_FROM tree.
 *
 * This used to hold an "include parent samples?" prompt that never ran: the
 * function returned unconditionally on its third line, so the prompt below it
 * was unreachable and includeSampleTree was always 1. Behavior is unchanged --
 * reviving the prompt would be a UX change, not a refactor. */
function downloadSamples(dg) {
	return nsDownloadSamples(nsCollectSelectedUids(dg), {includeTree: true});
}

function showSampleErrorMsg(errorMsg) {
	var header = '<div class="alert alert-danger alert-block"><h4 class="alert-heading">Sample export Failed!</h4></div>';
	var todo = '';
	var msginfo = '<div><h5>' + errorMsg + '</h5></div>';
	var content = header + todo + msginfo;
	$.messager.alert({
		title: 'Sample exporting...',
		msg: content,
		icon: 'error',
		width: 500
	});
	return;
}

/* Same story as downloadSamples: everything after the third line was dead,
 * so this always downloaded the full tree. Behavior preserved. */
function downloadSamples0(dg) {
	return nsDownloadSamples(nsCollectSelectedUids(dg), {includeTree: true});
}

function deleteSamples(dg, url_delete) {
	var rows = dg.datagrid('getRows');
	if (rows.length == 0) {
		alert('No sample in the table is selected for deletion.');
		return;
	}
	var allIds = [];
	for (var i = 0; i < rows.length; i++) {
		var row = rows[i];
		if (row.ck) {
			allIds.push(row.id);
		} else {}
	}
	if (allIds.length == 0) {
		alert('No sample in the table is selected for deletion.');
		return;
	}
	var allids = JSON.stringify(allIds);
	var num = allIds.length;
	var n = num.toString();
	var msg = 'You have selected ' + n + ' samples for deletion.\n'
	msg += 'You must be the owner of samples or the administrator to proceed.'
	msg += 'Please type "DELETE" to confirm the deletion,\n'
	msg += 'which is not recoverable. '
	$.messager.prompt('Deleting samples', msg, function(r) {
		if (r) {
			if (r != 'DELETE') {
				alert('you type: ' + r + ', which must be "DELETE" to proceed.');
				return
			} else {}
		} else {
			return;
		}
		var win = $.messager.progress({
			title: 'Please waiting',
			msg: 'Deleting samples ...'
		});
		$.get(url_delete, {
			'allids': allids
		}, function(data) {
			$.messager.progress('close');
			var obj = jQuery.parseJSON(data);
			var msg = obj.msg;
			var status = obj.status;
			var link = obj.link;
			var diclist = obj.diclist;
			var dg = $('#advanced_dgtable');
			var row = dg.datagrid('getSelected');
			var rows = dg.datagrid('getRows');
			for (var j = 0, len = rows.length; j < len; j++) {
				row = rows[j];
				var index = dg.datagrid('getRowIndex', row);
				for (var i = 0; i < diclist.length; i++) {
					var dici = diclist[i];
					var id = dici.id;
					var statusi = dici.statusi;
					if (rows[j]['id'] == id) {
						if (statusi == 'DELETED') {
							dg.datagrid('deleteRow', index);
						} else {
							dg.datagrid('updateRow', {
								index: index,
								row: {
									'json_metadata': dici.json_metadata
								}
							})
						}
					}
				}
			}
			if (status == 1) {
				window.location.href = link;
			} else {
				alert(msg);
			}
			return;
		});
		return;
	});
}


function publishSamples(dg, url_publish) {
	return publishSamplesAjax(dg, url_publish);
}

function publishSamplesAjax(dg, url_publish) {
	var rows = dg.datagrid('getRows');
	if (rows.length == 0) {
		alert('No sample in the table is selected for publish.');
		return;
	}
	var allIds = [];
	for (var i = 0; i < rows.length; i++) {
		var row = rows[i];
		if (row.ck) {
			allIds.push(row.id);
		} else {}
	}
	if (allIds.length == 0) {
		alert('No sample in the table is selected for publish.');
		return;
	}
	var url = '/seek/samples/publishlist/' + allIds.toString() + '/';
	window.open(url);
	return;
}

function sendSamples(dg, url_publish) {
	var rows = dg.datagrid('getRows');
	if (rows.length == 0) {
		alert('No sample in the table is selected for publish.');
		return;
	}
	var allIds = [];
	var allUIDs = '';
	for (var i = 0; i < rows.length; i++) {
		var row = rows[i];
		if (row.ck) {
			allIds.push(row.id);
			allUIDs += row.uuid + '\n';
		} else {}
	}
	if (allIds.length == 0) {
		alert('No sample in the table is selected for publish.');
		return;
	}
	$("#input_searchUIDs").textbox('setText', allUIDs);
	var msg = "Number of samples submitted for retrieval: " + allIds.length;
	$("#search_tab").tabs('select', "Sample Retrieval");
	retriveAdvanced();
	return;
}
</script>
