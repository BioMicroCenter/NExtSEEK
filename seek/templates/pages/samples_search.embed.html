<script type="text/javascript">

	var type_options = {{report.type_options|safe}};

	/* The value type of the chosen attribute ('numeric', 'date', 'string' or 'bool'), from
	   /seek/operators/; SampleSearchCore.simpleBody sends numbers as numbers. */
	var simple_filterType = '';

	/* Clears a combobox and empties its list, but only once EasyUI has built it: a call on
	   an unbuilt box throws, and a throw while EasyUI parses the page stops it building
	   every tab and grid after it. */
	function simple_comboReset(id) {
		var box = $(id);
		if (!box.data('combobox')) { return; }
		box.combobox('clear');
		box.combobox('loadData', []);
	}

	function simple_getAttributes(rec) {
		if (rec.id == 0) {
			return;
		} else {
		}
		var url = '/seek/attributes/id=' + rec.id + '/';
		$.get(url, {}, function(data) {
			var obj = jQuery.parseJSON(data);
			var msg = obj.msg;
			var status = obj.status;
			if (status == 1) {
				var attr_options = obj.attrOptions;
				// The previous type's attribute and rule do not exist on this one.
				simple_comboReset('#simple_sample_attribute');
				simple_comboReset('#filter_rule');
				simple_filterType = '';
				$('#simple_sample_attribute').combobox('loadData', attr_options);
			} else {
				alert(msg);
			}
			return;
		});
	}

	function simple_getOperators(rec) {
		if (rec.attribute == 'none') {
			simple_filterType = '';
			return;
		} else {
		}
		var sampletype_id = $('#simple_sample_type').combobox('getValue');
		var attribute = rec.attribute;
		var url = '/seek/operators/';
		$.get(url, {
			'sampletype_id': sampletype_id,
			'attribute': attribute
		}, function(data) {
			var obj = jQuery.parseJSON(data);
			var msg = obj.msg;
			var status = obj.status;
			if (status == 1) {
				// Every rule graph_search has an operator for (all of the old engine's, Not Contain,
				// True and False included); the first one offered is selected.
				simple_filterType = obj.filter_type || '';
				var offered = SampleSearchCore.offeredRules((obj.filter_rule || []).map(function (r) { return r.name; }));
				var filter_rule = (obj.filter_rule || []).filter(function (r) { return offered.indexOf(r.name) >= 0; });
				filter_rule.forEach(function (r, i) { r.selected = (i === 0); });
				$('#filter_rule').combobox('loadData', filter_rule);
				var placeholder_start = obj.placeholder_start;
				document.getElementById("input_valueFrom").setAttribute('placeholder', placeholder_start);
				document.getElementById("input_valueFrom").setAttribute('value', '');
				var placeholder_end = obj.placeholder_end;
				document.getElementById("input_valueTo").setAttribute('placeholder', placeholder_end);
				document.getElementById("input_valueTo").setAttribute('value', '');
			} else {
				alert(msg);
			}
			return;
		});
	}

	function simple_displaySamples(rec) {
		alert(rec.id);
		var url = '/seek/sample_types/id=' + rec.id + '/';
		if (rec.id == 0) {
			return;
		} else {
		}
		return;
	}

	function simple_getSearchVariables() {
		var listdic = {};
		listdic["keywords"] = document.getElementById("searching").value;
		return listdic;
	}

	function simple_jsonconvertdic(listdic) {
		var jsontry = JSON.stringify(listdic);
		return jsontry;
	}

	/* Sends the box to POST /nextseek_api/samples/graph_search/ (nsSearchRun in
	   searchAdvanced.html): the chosen type by title, the attribute and rule as typed
	   conditions and Associated with as a lineage condition, a page at a time into
	   #simple_dgtable. */
	function simple_searchSamples() {
		var built = SampleSearchCore.simpleBody({
			sampletype: SampleSearchCore.typeTitle(type_options, $('#simple_sample_type').combobox('getValue')),
			attribute: $('#simple_sample_attribute').combobox('getValue'),
			rule: $('#filter_rule').combobox('getValue'),
			from: document.getElementById("input_valueFrom").value,
			to: document.getElementById("input_valueTo").value,
			filterType: simple_filterType
		});
		// Associated with: only samples with a sample of that type in their lineage tree.
		built = SampleSearchCore.withLineage(built, SampleSearchCore.lineage({
			sampletype: $('#simple_assoc_type').combobox('getValue'),
			direction: $('#simple_assoc_direction').val()
		}));
		nsSearchRun('simple', built, 1, nsSearchPageSize('simple'));
	}
</script>

<div class="span12">
	<form method="post" enctype="multipart/form-data" action="">
		{% csrf_token %}
		<div class="well">
			<div class="row show-grid">
				<table class="table" style="width:100%">
					<thead>
						<tr>
							<th>Sample Type <a href="/seek/sampletypes/" title="What each sample type means" style="color:var(--ns-muted);text-decoration:none;"><i class="bi bi-info-circle"></i></a>:</th>
							<th>Sample Attribute <a href="/seek/samples/attributes/" title="What each attribute means" style="color:var(--ns-muted);text-decoration:none;"><i class="bi bi-info-circle"></i></a>:</th>
							<th>Operator:</th>
							<th>From:</th>
							<th>To:</th>
								<th></th>
						</tr>
					</thead>
					<tbody>
						<tr>
                            <td><input id="simple_sample_type" class="easyui-combobox" name="simple_sample_type" style="width:100%;" data-options="showItemIcon: true, data: type_options, valueField:'id', textField:'title', groupField:'group', editable: true, filter: function(q, row){ var opts = $(this).combobox('options'); return row[opts.textField].toUpperCase().indexOf(q.toUpperCase()) >= 0;}, panelHeight:'auto', label: '', labelPosition: 'top', onSelect: function(rec){ simple_getAttributes(rec); }, onFocus: function() {$(this).combobox('showPanel');}"></td>
<script type="text/javascript">
        $(document).ready(function() {
            const sampleType = document.getElementsByName('simple_sample_type')[0].previousElementSibling
            const sampleAttribute = document.getElementsByName('simple_sample_attribute')[0].previousElementSibling
            sampleType.addEventListener('click', function() {
              console.log('Sample Type Clicked!');
              $('#simple_sample_type').combobox('showPanel')
            });
            sampleAttribute.addEventListener('click', function() {
              console.log('Sample Attributes clicked!');
              $('#simple_sample_attribute').combobox('showPanel')
            });
        }); 
</script>
<td><input id="simple_sample_attribute" class="easyui-combobox" name="simple_sample_attribute" style="width:100%;" data-options="showItemIcon: true, valueField:'attribute', textField:'name', editable: true, filter: function(q, row){ var opts = $(this).combobox('options'); return row[opts.textField].toUpperCase().indexOf(q.toUpperCase()) >= 0;}, panelHeight:'auto', label: '', labelPosition: 'top', onSelect: function(rec){ simple_getOperators(rec); }"></td>
							<td><input id="filter_rule" class="easyui-combobox" name="filter_rule" style="width:100%;" data-options="showItemIcon: true, valueField:'name', textField:'operator', editable: false, panelHeight:'auto', label: '', labelPosition: 'top', onSelect: function(rec){ }"></td>
							<td><input id="input_valueFrom" label="" labelposition="left" value="" placeholder="start value" style="width:150px;height:30px"></td>
							<td><input id="input_valueTo" label="" labelposition="left" value="" placeholder="end value" style="width:150px;height:30px"></td>
							<td style="vertical-align:middle; white-space:nowrap; text-align:right;">
								<span class="ns-search-actions">
									<a href="javascript:void(0)" class="ns-btn-reset" onclick="nsResetSearch($('#simple_dgtable'), ['#simple_sample_type','#simple_sample_attribute','#filter_rule','#input_valueFrom','#input_valueTo','#simple_assoc_type','#simple_assoc_direction'])">Reset</a>
									<a href="javascript:void(0)" class="ns-btn-search" onclick="simple_searchSamples()"><span class="glyphicon glyphicon-search"></span> Search</a>
								</span>
							</td>
						</tr>
						<tr>
							<td colspan="6" style="white-space:nowrap;">Associated with (optional) <a href="/seek/sampletypes/" title="Keep only samples with a sample of this type somewhere in their lineage tree: an ancestor it came from, or a descendant made from it" style="color:var(--ns-muted);text-decoration:none;"><i class="bi bi-info-circle"></i></a>:
								<input id="simple_assoc_type" class="easyui-combobox" name="simple_assoc_type" style="width:250px;" data-options="showItemIcon: true, data: SampleSearchCore.associatedOptions(type_options), valueField:'title', textField:'label', groupField:'group', editable: true, filter: function(q, row) { var opts = $(this).combobox('options'); return row[opts.textField].toUpperCase().indexOf(q.toUpperCase()) >= 0; }, panelHeight:'auto', label: '', labelPosition: 'top'">
								<select id="simple_assoc_direction" name="simple_assoc_direction" style="height:30px;" title="Where in the lineage tree the sample of that type may be"><option value="">Either</option><option value="ancestor">Ancestors only</option><option value="descendant">Descendants only</option></select>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</form>
</div>
