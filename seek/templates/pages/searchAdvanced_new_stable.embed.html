<br>
<div class="row show-grid">
	<div class="col-xs-4 col-sm-2 col-md-2">
		<b>Number of samples found:</b>
	</div>
	<div class="col-xs-2 col-sm-1 col-md-1">
		<b><label id="numberSamplesFound"></label></b>
	</div>
	<div class="col-xs-4 col-sm-2 col-md-2">
		<b>Number of sample types:</b>
	</div>
	<div class="col-xs-10 col-sm-7 col-md-7">
		<b><label id="numberSampleTypesFound"></label></b>
	</div>
</div>

<div id="sample_table_div" style="height:auto">
	<div style="margin:20px 0;"></div>
	<table id="advanced_dgtable" class="easyui-datagrid" title="" style="width:100%; height:480px;" data-options="
		iconCls: 'icon-edit',
		singleSelect: false,
		checkOnSelect: true,
		selectOnCheck: true,
		ctrlCheck: true,
		url:'',
		method:'get',
		toolbar: '#advanced_tb_toolbar',
		striped: true,
		pagination : true,
		pageSize:100,
		pageList: [20,40,60,80,100],
		showFooter: false,
		multiSort: true,
		remoteFilter: false
	">
		<thead>
			<tr>
				<th data-options="field:'ck',width:100,align:'center', checkbox:true, editor:{type:'checkbox',options:{on:'Y',off:'N'}}">Select file</th>
				<th data-options="field:'idurl',width:60" sortable="true"><b>ID</b></th>
				<th data-options="field:'uuid',width:200,editor:'text'" sortable="true"><b>UID</b></th>
				<th data-options="field:'sample_type',width:100" sortable="true"><b>Sample Type</b></th>
				<th data-options="field:'attributeValue',align:'left',width:900"><b>Attribute:Value</b></th>
			</tr>
		</thead>
	</table>

	<div id="advanced_tb_toolbar" style="height:auto">
		<a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="downloadSamples($('#advanced_dgtable'))">Download samples</a>
		<a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-remove',plain:true" onclick="gridDeleteSamples($('#advanced_dgtable'))">Delete samples</a>
	</div>
</div>
