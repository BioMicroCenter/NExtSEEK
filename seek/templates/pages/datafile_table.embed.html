<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-filter.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-export.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/custom/datagrid-custom.js"></script>
<style type="text/css">
  .datagrid-row-alt{
        background: #e6f2ff;
    }
</style>
<div id="sample_table_div" style="height:auto">
	<div style="margin:20px 0;"></div>
	<table id="dgtable" class="easyui-datagrid" title="" style="width:auto; height:680px;"
			data-options="striped: true,
										toolbar: '#tb_toolbar',
										singleSelect: false,
										checkOnSelect: true,
										selectOnCheck: true,
										ctrlCheck: true,
										pagination: true,
										pageSize: 50,
										multiSort: true">
		<thead>
			<tr>
			  <th data-options="field:'ck',width:100,align:'center', checkbox:true, editor:{type:'checkbox',options:{on:'Y',off:'N'}}">Select file</th>
				<th data-options="field:'id',width:60" sortable="true"><B>ID</B></th>
				<th data-options="field:'title',width:400" sortable="true"><B>UID</B></th>
				<th data-options="field:'link',width:400" sortable="true"><B>SEEK URL</B></th>
			</tr>
		</thead>
	</table>
	<div id="tb_toolbar" style="height:auto">
		<a href="javascript:;" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="downloadSops($('#dgtable'))">Download selected</a>			
	</div>
</div>
<script>
	const seek_url = "{{ report.seek_url }}";
	
	function getCookie(name) {
		let cookieValue = null;
		if (document.cookie && document.cookie !== '') {
			const cookies = document.cookie.split(';');
			for (let i = 0; i < cookies.length; i++) {
				const cookie = cookies[i].trim();
				if (cookie.substring(0, name.length + 1) === (name + '=')) {
					cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
					break;
				}
			}
		}
		return cookieValue;
	}

	function downloadBlobToFile(blob, filename) { 
	  const downloadUrl = URL.createObjectURL(blob);
	  const a = document.createElement("a");
	  a.href = downloadUrl;
	  a.download = filename;
	  document.body.appendChild(a);
	  a.click();
  
	  a.remove();
	  URL.revokeObjectURL(downloadUrl);
	}

	async function downloadDataFiles(dgtable) {
		const selections = dgtable.datagrid("getSelections")
		
		const createPayload = (selections) => {
			if (selections.length > 1) {
				return selections.map(sop => {
					return {"uid_or_id": sop.id}
				})
			} else {
				return {"uid_or_id": selections[0].id}
			}
		}

		const payload = createPayload(selections)

		try {
			const response = await fetch("/nextseek_api/data_files/download/", {
				method: "POST",
				headers: {"Content-Type": "application/json",
									"X-CSRFTOKEN": getCookie("csrftoken")},
				body: JSON.stringify(payload)
			});

			if (response.ok) {
				Date.prototype.yyyymmdd = function() {
					var mm = this.getMonth() + 1;
					var dd = this.getDate();

					return [this.getFullYear(),
	          (mm>9 ? '' : '0') + mm,
	          (dd>9 ? '' : '0') + dd
	         ].join('');
				};
				const today = new Date();
				const blob = await response.blob();
				let filename;
				if (selections.length == 1) {
					filename = selections[0]["title"]
				} else {
					filename = `${today.yyyymmdd()}-data-files.zip`
				}
				downloadBlobToFile(blob, filename)
			} else {
				console.log("Error")
			}
		}	catch (e) {
			console.error(e);
		}
	}
	
	async function listDataFiles() {
		const csrftoken = getCookie('csrftoken');
		try {
			const response = await fetch("/nextseek_api/data_files/", {
				method: "GET",
			});
			if (response.ok) {
				const dataFiles = await response.json()
				const dataFilesData = dataFiles.data.map(df => {
					let newMap = {};
					let link = seek_url + df.links.self;
					newMap["id"] = df.id;
					newMap["title"] = df.attributes.title;
					newMap["link"] = `<a href="${link}">${link}</a>`;
					return newMap
				})
				return dataFilesData
			} else {
				console.log("Could not get data files")
				return null
			}
		} catch (e) {
			console.error(e);
			return null
		}
	}

	async function loadDataGrid() {
		dataFiles = await listDataFiles()
		// enableFilter installs the loadFilter that both applies the column
		// filters and slices rows down to the current page. It only re-runs the
		// load itself when filter rules are already active, which is never true
		// on first paint — so the grid has to be populated AFTER it is
		// installed. Loading first (datagrid({data: ...})) renders every row at
		// once and leaves the pager's next/last buttons wired to the default
		// server-side handler, which does nothing without a url option.
		const dg = $('#dgtable');
		dg.datagrid('enableFilter', [{
			field:'id',
			type:'label'
		}]);
		dg.datagrid('loadData', dataFiles || []);
	}

	loadDataGrid()
</script>
