<div class="span12">
	<h4>Retrieve a list of sample UIDs. Values are delimited by new lines.</h4>
	<form id="sample_retrieval" method="post" enctype="multipart/form-data">
		<textarea id="input_searchUIDs" name="input_searchUIDs" style="width: 70%;" rows=10 cols=20></textarea>
		<button type="submit" class="easyui-linkbutton" data-options="iconCls:'icon-search',plain:true">Retrieve</button>
	</form>
</div>
<script>
	function retrieveSamples(form) {
		const raw = new FormData(form).get("input_searchUIDs") || ""
		// Split on any whitespace so a trailing newline or a pasted space-separated
		// list does not produce empty identifiers.
		return nsDownloadSamples(String(raw).trim().split(/\s+/),
		                         {includeTree: true, filename: "sample_retrieval.xlsx"})
	}

	const sample_retrieval_form = document.getElementById("sample_retrieval")

	sample_retrieval_form.addEventListener("submit", (event) => {
		event.preventDefault()
		retrieveSamples(sample_retrieval_form)
	})
</script>
