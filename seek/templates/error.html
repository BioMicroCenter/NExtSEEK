{% extends "base.html" %}
{% load mezzanine_tags keyword_tags %}

{% block title %}Error - NExtSEEK{% endblock %}

{% block main %}
<div style="max-width:560px;margin:4rem auto;text-align:center;padding:0 1rem;">
    <div style="font-size:3rem;color:var(--ns-crimson);margin-bottom:1rem;">
        <i class="bi bi-exclamation-circle"></i>
    </div>
    <h1 style="font-family:var(--ns-font-display);font-size:1.5rem;font-weight:700;color:var(--ns-ink);margin-bottom:0.75rem;letter-spacing:-0.02em;">
        Access Error
    </h1>
    <p style="font-size:0.925rem;color:var(--ns-body);margin-bottom:2rem;line-height:1.6;">
        {{ data.msg }}
    </p>
    <a href="/" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.55rem 1.25rem;background:var(--ns-crimson);color:#fff;border-radius:7px;text-decoration:none;font-size:0.875rem;font-weight:600;transition:background 0.15s;"
       onmouseover="this.style.background='#8a1a2b'" onmouseout="this.style.background='var(--ns-crimson)'">
        <i class="bi bi-house-door"></i> Go to Home
    </a>
</div>
{% endblock %}
