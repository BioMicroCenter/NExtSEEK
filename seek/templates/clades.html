{% extends "base.html" %}
{% include "pages/seek_includes.html" %} 
{% block main %}

<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-filter.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-export.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/custom/datagrid-custom.js"></script>

<script type="text/javascript">

  var clades = {{ clades | safe }};
  var sample_types = {{ stc | safe }};

  $(document).ready(function(){
    window.stc_dg = $('#stc_dg').datagrid();
    window.stc_dg.datagrid('loadData', sample_types);
  });

  $(function() {
    window.dg = $('#dg_clade').datagrid();
    window.dg.datagrid('loadData', clades);
  });

  function cladesSyncSampleTypes() {
    fetch('syncSampleTypes', {
      method: 'POST',
      headers: {"X-CSRFToken": "{{ csrf_token }}"},})
    .then(data => console.log(data))
  }
  
  function saveSelectedIntoDB(dg, url) {
    var records = [];
    var rows = dg.datagrid('getChanges');

    if (rows.length == 0) {
      alert("You have not entered any new clade information!");
      return false;
    }

    for (var i=0; i<rows.length; i++) {
      var row = rows[i];
      var record = {};

      for (var key in row) {
        var value = row[key];
        record[key] = value;
      }
      records.push(record);
    }

    var msg = 'You have entered ' +
              rows.length +
              ' records for saving. Do you really want to save?';

    $.messager.confirm('Saving record', msg, function(r) {
      if (r) {
        
      } else {
        return false;
      }

      var win = $.messager.progress({
        title: 'Please wait',
        msg: 'Saving record ...'
      });

      $.get(url, { records: JSON.stringify(records)}, function(data) {
        $.messager.progress('close');

        var obj = jQuery.parseJSON(data);
        var msg = obj.msg;
        var link = obj.link;
        var status = obj.status;
        if (!status) {
					var msg2 = "Error in saving record. <br/><br/>";
					msg2 += msg;
					alert(msg);
					window.location.href = link;
					return false;
				} else{
					$.messager.alert('Saving record',msg,'info');
				}
				window.location.href = link;
				return true;
      });
      return true;
    });
    return true;
  }
</script>

<div id="clade_tab" class="easyui-tabs" style="width:auto;height:900px;">
  <div title="Clades" data-options="closable:false" style="overflow:auto;padding:20px;display:none;">
  	<div class="easyui-layout" style="width:auto;height:900px;">
      <div id="center_div" data-options="region:'center',border:false" style="display:flex;flex-direction:column;gap:2em;height: 600px;">
        <div id="clades_table_div" style="height:auto">
        	<div style="margin:20px 0;"></div>
          <h1>Clades</h1>
        	<table id="dg_clade" class="easyui-datagrid" title="" style="width:auto; height:fit-content;"
        			data-options="
        				iconCls: 'icon-edit',
        				singleSelect: true,
        				selectOnCheck: false,
        				url:'',
        				method:'get',
        				toolbar: '#tb_toolbar',
        				striped: true,
        				pagination : false,
                onClickCell: onClickCell,
                onEndEdit: onEndEdit,
        				showFooter: false,
        				remoteFilter: false
        			">
        		<thead>
        			<tr>
        				<th data-options="field:'id',width:60"><B>ID</B></th>
        				<th data-options="field:'title',width:60,editor:'text'"><B>Title</B></th>
        				<th data-options="field:'color',width:200,editor:'text'"><B>Color</B></th>
        				<th data-options="field:'order',width:200,editor:'text'"><B>Order</B></th>
        			</tr>
        		</thead>
        	</table>
        	<div id="tb_toolbar" style="height:auto">
        		<a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-add',plain:true" onclick="append($('#dg_clade'))">Add a clade</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-remove',plain:true" onclick="removeit($('#dg_clade'), '/seek/clade/delete')">Remove a clade</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="accept($('#dg_clade'), '/seek/clade/save')">Save a clade</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-undo',plain:true" onclick="reject($('#dg_clade'))">Cancel</a>
          </div>
        </div>
        <div id="stc_table_div">
          <h1>Sample Types Clade Association</h1>
        	<table id="stc_dg" class="easyui-datagrid" title="" style="width:auto; height:fit-content;"
        			data-options="
        				iconCls: 'icon-edit',
        				singleSelect: true,
        				selectOnCheck: false,
        				toolbar: '#stc_tb_toolbar',
        				striped: true,
        				pagination : false,
                onClickCell: onClickCell,
                onEndEdit: onEndEdit,
        				showFooter: false,
        				remoteFilter: false
        			">
        		<thead>
        			<tr>
                <th data-options="field:'sample_type_id', width:60">
                  <B>Sample Type ID</B>
                </th>
        				<th data-options="field:'sample_type_title',width:60">
                  <B>Sample Type Title</B>
                </th>
        				<th data-options='field:"clade_title",width:60,
        						editor:{
        							type:"combobox",
        							options:{
        								valueField: "id",
        								textField: "title",
        								data: clades,
        								required:true
        							}
        						}'>
                  <B>Clade</B>
                </th>
        			</tr>
        		</thead>
        	</table>
        	<div id="stc_tb_toolbar" style="height:auto">
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-reload',plain:true" onclick="cladesSyncSampleTypes()">Sync Sample Types</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="accept($('#stc_dg'), '/seek/clade/sampleTypes/save')">Save</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-undo',plain:true" onclick="reject($('#stc_dg'))">Cancel</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
    
{% endblock %}
