{% extends "base.html" %}
{% include "pages/seek_includes.html" %} 
{% block main %}

<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-filter.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-export.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/custom/datagrid-custom.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/easyui/datagrid-detailview.js"></script>
<script type="text/javascript" src="{{STATIC_URL}}js/custom/ns-vocab-workbench.js"></script>

<script type="text/javascript">

  var clades = {{ clades | safe }};
  var sample_types = {{ stc | safe }};

  var nsWorkbench;

  $(document).ready(function(){
    window.stc_dg = $('#stc_dg').datagrid({
      view: detailview,
      // Synthetic tier group-header rows (row._nsHeader, minted by
      // ns-vocab-workbench.js's layout()) render their own arrow in
      // titleFormatter and open nothing when expanded — there is no detail
      // to show. Mark the <tr> so nextseek.css can hide the row's own
      // (redundant) expander control; see the .ns-wb-header-row rule there
      // for why visibility:hidden rather than display:none.
      rowStyler: function(index, row){
        return (row && row._nsHeader) ? 'ns-wb-header-row' : '';
      },
      detailFormatter: function(index, row){
        return nsWorkbench.detailFormatter(index, row);
      }
    });
    nsWorkbench = nsVocabWorkbench({
      grid: window.stc_dg,
      entityLabel: 'Sample Type',
      entityIdField: 'sample_type_id',
      entityTitleField: 'sample_type_title',
      vocabIdField: 'clade_id',
      vocabTitleField: 'clade_title',
      rows: sample_types,
      saveUrl: '/seek/clade/sampleTypes/save/',
      suggestionsUrl: null,
      csrfToken: '{{ csrf_token }}'
    });
  });

  $(function() {
    window.dg = $('#dg_clade').datagrid();
    window.dg.datagrid('loadData', clades);
  });

  // The combobox editor on the association grid writes only the id. Nothing
  // else populates the matching title field, so without this the workbench's
  // suggested-value formatter would take its "already mapped" branch and
  // render an empty cell right after the curator picked a value. easyui calls
  // onEndEdit before it refreshes the row (jquery.easyui.min.js `_773`:
  // onEndEdit -> destroy editors -> refreshRow), so the title set here is what
  // the formatter renders.
  function nsCladeAssociationEndEdit(index, row) {
    // Never touch a synthetic group-header row.
    if (!row || row._nsHeader) { return; }
    var ed = $(this).datagrid('getEditor', {index: index, field: 'clade_id'});
    if (!ed || !$(ed.target).data('combobox')) { return; }
    row.clade_title = $(ed.target).combobox('getText');
  }

  function cladesSyncSampleTypes() {
    fetch('syncSampleTypes/', {
      method: 'POST',
      headers: {"X-CSRFToken": "{{ csrf_token }}"},})
    .then(data => console.log(data))
  }
</script>

<div id="clade_tab" class="easyui-tabs" style="width:auto;height:900px;">
  <div title="Clades" data-options="closable:false" style="overflow:auto;padding:20px;display:none;">
  	<div class="easyui-layout" style="width:auto;height:900px;">
      <div id="center_div" data-options="region:'center',border:false" style="display:flex;flex-direction:column;gap:2em;height: 600px;">
        <!-- ns-workbench scopes the roomier, wrapping cell geometry in
             themes/NextSeek/static/css/nextseek.css to this page's grids only;
             every other datagrid in the app keeps easyui's stock 18px rows. -->
        <div id="clades_table_div" class="ns-workbench" style="height:auto">
        	<div style="margin:20px 0;"></div>
          <h1>Clades</h1>
        	<table id="dg_clade" class="easyui-datagrid" title="" style="width:auto; height:fit-content;"
        			data-options="
        				iconCls: 'icon-edit',
        				singleSelect: true,
        				selectOnCheck: false,
        				url:'',
        				method:'get',
        				toolbar: '#tb_toolbar',
        				striped: true,
        				pagination : false,
                onClickCell: onClickCell,
                onEndEdit: onEndEdit,
        				showFooter: false,
        				remoteFilter: false
        			">
        		<thead>
        			<tr>
        				<th data-options="field:'id',width:60"><B>ID</B></th>
        				<th data-options="field:'title',width:60,editor:'text'"><B>Title</B></th>
        				<th data-options="field:'color',width:200,editor:'text'"><B>Color</B></th>
        				<th data-options="field:'order',width:200,editor:'text'"><B>Order</B></th>
        			</tr>
        		</thead>
        	</table>
        	<div id="tb_toolbar" style="height:auto">
        		<a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-add',plain:true" onclick="append($('#dg_clade'))">Add a clade</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-remove',plain:true" onclick="nsRemovePost($('#dg_clade'), '/seek/clade/delete/', '{{ csrf_token }}')">Remove a clade</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="nsAcceptPost($('#dg_clade'), '/seek/clade/save/', '{{ csrf_token }}')">Save a clade</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-undo',plain:true" onclick="reject($('#dg_clade'))">Cancel</a>
          </div>
        </div>
        <div id="stc_table_div" class="ns-workbench">
          <h1>Sample Types Clade Association</h1>
        	<table id="stc_dg" class="easyui-datagrid" title="" style="width:auto; height:fit-content;"
        			data-options="
        				iconCls: 'icon-edit',
        				singleSelect: true,
        				selectOnCheck: false,
        				toolbar: '#stc_tb_toolbar',
        				striped: true,
        				pagination : false,
                onClickCell: nsWbClickCell,
                onEndEdit: nsCladeAssociationEndEdit,
        				showFooter: false,
        				remoteFilter: false
        			">
        		<thead>
        			<tr>
                <th data-options="field:'sample_type_id', width:60">
                  <B>Sample Type ID</B>
                </th>
        				<th data-options="field:'sample_type_title',width:420, formatter: function(v,r){ return nsWorkbench.titleFormatter(v,r); }">
                  <B>Sample Type</B>
                </th>
        				<th data-options='field:"clade_id",width:300,
                    formatter: function(v,r){ return nsWorkbench.suggestedFormatter(v,r); },
        						editor:{
        							type:"combobox",
        							options:{
        								valueField: "id",
        								textField: "title",
        								data: clades,
        								required: true
        							}
        						}'>
                  <B>Clade</B>
                </th>
        			</tr>
        		</thead>
        	</table>
        	<div id="stc_tb_toolbar" style="height:auto">
            <span id="ns-wb-count" class="ns-wb-count attrs-count"></span>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-reload',plain:true" onclick="cladesSyncSampleTypes()">Sync Sample Types</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="nsAcceptPost($('#stc_dg'), '/seek/clade/sampleTypes/save/', '{{ csrf_token }}')">Save</a>
            <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-undo',plain:true" onclick="reject($('#stc_dg'))">Cancel</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
    
{% endblock %}
