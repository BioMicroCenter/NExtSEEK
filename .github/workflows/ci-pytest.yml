name: pytest (informational)

# Informational by decision: this job surfaces NEW failures against a committed
# baseline, and a failing test in the lanes never blocks. The suite is not green
# and will not be; a "must be green" gate fails on run one and is ignored by run
# five. Only the two blocking steps at the end, which run checks that are green
# today, can fail the job on a test result.
#
# Measured 2026-09-01 on ghcr.io/astral-sh/uv:debian, cold cache, with the lane
# list from before the NessieAI move:
#   uv sync 45s, tests 4m10s, 228 failed / 7663 passed / 73 errors.
# The current lane list was last measured in the gate lane; see the header of
# ci/pytest-baseline.txt.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No system packages are needed. The application image is built from
      # ghcr.io/astral-sh/uv:debian and installs nothing beyond openssh-client,
      # so every dependency resolves as a wheel, mysqlclient included.
      - name: Install dependencies
        run: uv sync

      # baml_client is generated and gitignored, so a fresh checkout lacks it and
      # imports of the router fail without this step.
      - name: Generate the BAML client
        run: uv run baml-cli generate --from ./NessieAI/dmac_assistant/baml_src --no-version-check

      # Not continue-on-error: this step fails only when the lanes did not run at
      # all (see the exit-code check at the end), never because tests failed.
      - name: Run the no-stack lanes
        id: lanes
        env:
          # SQLite in memory, and stubs for everything that normally comes from
          # dmac/local_settings.py, which is gitignored and absent here.
          DJANGO_SETTINGS_MODULE: dmac.test_settings
          # This repo has been bitten by stale .pyc producing untrustworthy results.
          PYTHONDONTWRITEBYTECODE: "1"
          # dmac.settings creates LOG_DIR at import; /app does not exist on a runner.
          LOG_DIR: ${{ runner.temp }}/logs
        run: |
          set +e
          # Explicit paths are MANDATORY. A bare `pytest` at the repo root hits 6
          # collection errors and exits without running a single test.
          # --continue-on-collection-errors is likewise mandatory, for the same reason.
          # Never add -p no:logging: it removes the plugin providing caplog and
          # manufactures "fixture 'caplog' not found" errors.
          # Name each NessieAI/tests/<unit> lane; never pass NessieAI/ wholesale.
          # That would also collect NessieAI/history (frozen, never run), the
          # cc-runtime suite under NessieAI/docker (its own uv env and pytest
          # config) and the nessie_tests harness, which is not a CI lane yet.
          uv run pytest \
            nextseek_api seek startup scripts \
            NessieAI/tests/cc NessieAI/tests/router NessieAI/tests/hibayes \
            NessieAI/tests/ns NessieAI/tests/api NessieAI/tests/schema_rag \
            NessieAI/tests/chat_nextseek NessieAI/tests/build_tools \
            --continue-on-collection-errors -q \
            | tee pytest-run.txt
          rc=${PIPESTATUS[0]}
          echo "pytest exit: $rc"
          # Exit 0 or 1 means the lanes ran; failing tests are scored by the
          # baseline diff below, not here. Any other exit means they did not run:
          # 4 is what a lane path that no longer exists produces (a usage error,
          # zero tests executed), 2 is an interrupt, 3 an internal error, 5 means
          # nothing was collected. Passing that through as green would let the
          # diff report every baseline entry as fixed, so fail the step instead.
          if [ "$rc" -gt 1 ]; then
            echo "::error::pytest exited $rc, so the lanes did not run (4 means a lane path is missing or an argument is wrong)"
            exit "$rc"
          fi

      - name: Diff against the baseline
        run: |
          python ci/diff_baseline.py pytest-run.txt \
            --baseline ci/pytest-baseline.txt \
            --summary "$GITHUB_STEP_SUMMARY"

      # The first of three blocking steps in this otherwise informational job.
      # ci/gate holds the deterministic checks: the route registry completeness
      # gate, the docs map (ci/docs_map.py), the writer registry and the route
      # effects. `pytest ci/gate -q` is the count, not this comment. None of them
      # carries the "red on run one" risk that made the rest of the job
      # informational. The blocking steps run last so that a failing one never
      # suppresses the informational summary above them. Once the setup steps are
      # through, only four results can fail the job: this step, the migration
      # check and the blocking unit tests below, and the lanes step when pytest
      # did not run at all. Failing tests in the lanes never fail it.
      # The if: keeps this step running after a lanes-step failure, and skips it
      # only when setup failed before the lanes step was reached.
      - name: Blocking gates (route registry, docs map)
        if: ${{ !cancelled() && steps.lanes.outcome != 'skipped' }}
        env:
          DJANGO_SETTINGS_MODULE: dmac.test_settings
          PYTHONDONTWRITEBYTECODE: "1"
          # dmac.settings creates LOG_DIR at import; /app does not exist on a runner.
          LOG_DIR: ${{ runner.temp }}/logs
        run: uv run pytest ci/gate -q

      # The second blocking step: the unit tests ci/blocking_lanes.py names by
      # glob (the graph_sync and graph_search tests, and the Graph Search page's
      # view and JavaScript tests). They also run in the lanes above, where a
      # failure is only a report; here any failure fails the job. A new module
      # joins by its name. The page's JavaScript module skips wherever node is
      # missing, and a skip is green, so a runner without node fails here
      # instead. The paths go through a variable because a failing command
      # substitution inside pytest's argument list would not stop the step, and
      # pytest given no path walks the whole tree.
      # The third blocking step. It is scoped to nextseek_api by name, and the
      # scope is evidence-based rather than timid: Mezzanine's four apps propose
      # migrations that would be written into site-packages, so they can never
      # be clean from this repository, and seek is excluded pending a ruling on
      # two models whose DDL is applied out of band but which are declared
      # managed. Both are recorded in "Landmines" in ci/CLAUDE.md and measured in
      # docs/superpowers/plans/2026-09-16-ci-coverage-gaps-findings.md.
      # --skip-checks is required: without it Django stops on system check
      # 4_0.E001 for an empty CSRF_TRUSTED_ORIGINS before reaching migration
      # state. Widening the scope is a change to make deliberately, after the
      # named app is green, never by dropping the app argument.
      - name: Blocking migration check (nextseek_api)
        if: ${{ !cancelled() && steps.lanes.outcome != 'skipped' }}
        env:
          DJANGO_SETTINGS_MODULE: dmac.test_settings
          PYTHONDONTWRITEBYTECODE: "1"
          LOG_DIR: ${{ runner.temp }}/logs
        run: uv run python manage.py makemigrations --check --dry-run --skip-checks nextseek_api

      - name: Blocking unit tests (ci/blocking_lanes.py)
        if: ${{ !cancelled() && steps.lanes.outcome != 'skipped' }}
        env:
          DJANGO_SETTINGS_MODULE: dmac.test_settings
          PYTHONDONTWRITEBYTECODE: "1"
          # dmac.settings creates LOG_DIR at import; /app does not exist on a runner.
          LOG_DIR: ${{ runner.temp }}/logs
        run: |
          if ! command -v node >/dev/null; then
            echo "::error::node is not on this runner, so seek/tests/test_graph_search_js.py would skip every test instead of running them"
            exit 1
          fi
          paths=$(python ci/blocking_lanes.py)
          uv run pytest $paths -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-run
          path: pytest-run.txt
          retention-days: 14
