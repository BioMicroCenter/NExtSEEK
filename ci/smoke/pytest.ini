[pytest]
# Deliberately a separate rootdir. Running `pytest ci/smoke/` from the repo root
# would otherwise pick up the root pyproject.toml, whose [tool.pytest.ini_options]
# sets DJANGO_SETTINGS_MODULE. This suite runs OUTSIDE the container and has no
# Django installed. Same isolation trick as startup/pytest.ini.
addopts = --tb=short -ra
markers =
    write: mutates the database. Deselected by default; needs the ci_write superuser.
    flow: drives a real browser via Playwright.
    nessie: the Nessie lane (ci/smoke/test_nessie.py). On by default on local and dev; --no-nessie skips it.
    nessie_turn: needs a real chat turn (model spend). --nessie-no-turns skips it.
    graphwrite: the behavioural lane. Drives a real write and asserts the graph changed. Opt in with
        -m graphwrite; the cases that mutate existing rows need CI_WRITE_DESTRUCTIVE=1 as well.
