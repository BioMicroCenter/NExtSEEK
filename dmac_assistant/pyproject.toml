# Vendored subset of dmac_assistant for the NExtSEEK integration.
#
# Source: https://github.com/tavjo/dmac-assistant (main).
# This is an in-tree path dependency (same pattern NExtSEEK uses for
# chat_nextseek), NOT a rewrite — the package source under src/dmac_assistant
# is copied verbatim. Only the dependency set is trimmed to what the NExtSEEK
# integration actually imports at runtime: the BAML LLM router
# (dmac_assistant.router.*) and the Claude stream-json parser
# (dmac_assistant.streamjson). The fastapi/uvicorn/websockets server layer is
# intentionally NOT pulled in — NExtSEEK provides its own Django/Channels
# transport, so dmac_assistant.app / auth / ws are never imported.
[project]
name = "dmac-assistant"
version = "0.1.0"
description = "Vendored dmac_assistant core (LLM router + Claude stream-json) for the NExtSEEK additive integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baml-py~=0.222.0",
    "docker>=7.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmac_assistant"]
