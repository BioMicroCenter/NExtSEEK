[project]
name = "NExtSEEK"
version = "1.3.0"
description = "Extending SEEK for active management of scientific metadata"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "annotated-types",
  "asgiref",
  "attrs",
  "beautifulsoup4",
  "bleach",
  "certifi",
  "celery",
  "chardet",
  "charset-normalizer",
  "deepmerge",
  "dj-rest-auth",
  # Pinned to the 5.2 LTS line: Django 6.0 dropped MariaDB 10.5 support
  # (requires 10.6+), but this native server runs MariaDB 10.5.x. 5.2 supports
  # 10.5. Revisit if/when the server's MariaDB is upgraded to >=10.6.
  "Django>=5.2,<6",
  "django-contrib-comments",
  "django-cors-headers",
  "django-cprofile-middleware",
  "django-crontab",
  "django-filebrowser-no-grappelli",
  "django-markdownify",
  "django-widget-tweaks",
  "djangorestframework",
  "djangorestframework_simplejwt",
  "drf-spectacular",
  "drf-spectacular-sidecar",
  "duckdb",
  "et_xmlfile",
  "filebrowser-safe",
  "filelock",
  "fsspec",
  "grappelli-safe",
  "gunicorn",
  "hf-xet",
  "html5lib",
  "huggingface-hub",
  "idna",
  "importlib_metadata",
  "inflection",
  "isodate",
  "Jinja2",
  "joblib",
  "jsonref",
  "jsonschema",
  "jsonschema-specifications",
  "lxml",
  "Markdown",
  "MarkupSafe",
  "Mezzanine",
  "mpmath",
  "mysql-connector-python",
  "mysqlclient",
  "neo4j",
  "networkx",
  "numpy",
  "oauthlib",
  "olefile",
  "openpyxl",
  "orjson",
  "packaging",
  "pandas",
  "parse",
  "polars[calamine]",
  "pillow",
  "psutil",
  "pydantic",
  "pydantic_core",
  "PyJWT",
  "pyparsing",
  #"python-dateutil.post0",
  "pytz",
  "PyYAML",
  "referencing",
  "requests",
  "requests-oauthlib",
  "rpds-py",
  "scipy",
  "simplejson",
  "soupsieve",
  "sentence-transformers",
  "sqlparse",
  "sqlalchemy",
  "sympy",
  "threadpoolctl",
  "tinycss2",
  "tokenizers",
  "torch",
  "tqdm",
  "typing-inspection",
  "typing_extensions",
  "tzdata",
  "tzlocal",
  "Unidecode",
  "uritemplate",
  "urllib3",
  "webencodings",
  "xlwt",
  "zipp",
  "zstandard>=0.25",
  "chat_nextseek",
  "channels>=4.3.2",
  "daphne>=4.2.1",
  "dmac-assistant",
  # AES-GCM and HKDF for the login a Container-CC turn pass holds (nextseek_api/assistant/turn_pass.py).
  # Listed explicitly: it used to arrive only as a transitive dependency.
  "cryptography>=46",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# In-tree first-party packages: install EDITABLE so the venv imports the repo
# source directly (one source of truth), not a divergent site-packages copy.
chat_nextseek = { path = "NessieAI/chat_nextseek", editable = true }
# Additive dmac_assistant integration (router + Container-CC). Vendored in-tree
# as a path dependency, same pattern as chat_nextseek above.
dmac-assistant = { path = "NessieAI/dmac_assistant", editable = true }
# When chat_nextseek goes public, switch back to the pinned git install:
# chat_nextseek = { git = "https://github.com/cdemurjian/chat_nextseek.git", rev = "3948d857783e3d130bfe6a880fe53a9eefeb603a" }
torch = [
  { index = "pytorch-cpu" },
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dmac.settings"
markers = [
    "host_only: source-tree/host-lane test; excluded from in-container runs",
    "mysql_lane: needs lane M's real MySQL (lane_mysql); skipped unless DJANGO_SETTINGS_MODULE is dmac.test_settings_mysql",
]

[dependency-groups]
dev = [
    "coverage",
    "import-linter",
    "pytest-django",
    # tests that need a real MySQL import it (they skip without it); the startup CLI brings its own
    "PyMySQL",
    "ruff",
]
# Note: the startup CLI does NOT use a uv dependency group — it runs in an
# isolated env via `uv run --no-project --with typer --with rich`. This avoids
# pulling in the main project's deps (mysqlclient et al.) when the host lacks
# the C build toolchain. See startup.sh.

# Import contracts (ci/gate/test_import_contracts.py runs `lint-imports`).
# ignore_imports lists today's known debts (ARCHITECTURE.md "Known debts");
# fixing one means deleting its line.
[tool.importlinter]
root_packages = ["nextseek_api", "seek", "dmac", "chat_nextseek", "NessieAI"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Product code does not import the test tree"
type = "forbidden"
source_modules = [
    "nextseek_api", "seek", "dmac", "chat_nextseek",
    "NessieAI.build_tools", "NessieAI.cc", "NessieAI.hibayes", "NessieAI.ns",
    "NessieAI.router", "NessieAI.schema_rag",
]
forbidden_modules = ["NessieAI.tests"]
ignore_imports = [
    # test modules living inside product packages are exempt
    "nextseek_api.tests.** -> NessieAI.tests.**",
    # known debt
    "nextseek_api.management.commands.nessie -> NessieAI.tests.nessie_tests.*",
    "NessieAI.hibayes.human_grade_fit -> NessieAI.tests.nessie_tests.bayes_manifest",
    "NessieAI.cc.op_registry.paired_evidence -> NessieAI.tests.nessie_tests.*",
    "NessieAI.build_tools.gen_op_surfaces.route_capabilities -> NessieAI.tests.nessie_tests.*",
]

[[tool.importlinter.contracts]]
name = "chat_nextseek does not import nextseek_api"
type = "forbidden"
source_modules = ["chat_nextseek"]
forbidden_modules = ["nextseek_api"]
ignore_imports = [
    "chat_nextseek.orchestrator -> nextseek_api.assistant.excel_export",
]

[[tool.importlinter.contracts]]
name = "NessieAI.cc does not import seek or dmac"
type = "forbidden"
source_modules = ["NessieAI.cc"]
forbidden_modules = ["seek", "dmac"]
ignore_imports = [
    "NessieAI.cc.cc_provision -> seek.seekdb",
]

[[tool.importlinter.contracts]]
name = "NessieAI engine does not import nextseek_api"
type = "forbidden"
source_modules = [
    "NessieAI.ns", "NessieAI.router", "NessieAI.cc", "NessieAI.schema_rag", "NessieAI.hibayes",
]
forbidden_modules = ["nextseek_api"]
# Direct edges only: chat_nextseek reaches nextseek_api by its own known debt (contract above).
allow_indirect_imports = true
# Mirrors BACK_EDGE_ALLOWLIST (NessieAI/tests/api/test_nessie_boundaries.py), its nextseek_api
# targets only (minus task6_app, an import_module string the linter cannot see); the seek/dmac
# edges stay with the contract above. Fixing one means deleting its line.
ignore_imports = [
    "NessieAI.cc.cc_transcript_store -> nextseek_api.assistant.models_db",
    "NessieAI.cc.turn -> nextseek_api.assistant.models_db",
    "NessieAI.cc.turn -> nextseek_api.assistant.turn_pass",
    "NessieAI.router.risk_overlay -> nextseek_api.assistant.models_db",
    "NessieAI.router.turn_ledger -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.export -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.fit.fit_boundary -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.generation_store -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.generation_validation -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.human_grade_fit -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.judge_cache -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.paid_run_state -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.paired_run_registry -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.run_authorization -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.spend_conservation -> nextseek_api.assistant.models_db",
    "NessieAI.hibayes.task6_replay -> nextseek_api.assistant.models_db",
    "NessieAI.ns.reingest_qa -> nextseek_api.batch_upload.helpers",
    "NessieAI.ns.retry -> nextseek_api.assistant.models_db",
    "NessieAI.ns.retry -> nextseek_api.assistant.models_evaluator",
    "NessieAI.ns.turn -> nextseek_api.assistant.session_adapter",
    "NessieAI.ns.turn_memory -> nextseek_api.assistant.models_db",
    "NessieAI.schema_rag -> nextseek_api.models",
    "NessieAI.schema_rag.service -> nextseek_api.models",
]
